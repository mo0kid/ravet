# Source for docs/FEATURES.md. Edit this file, then run:
# python3 scripts/check-docs.py --write
schema_version = 1

# Records are ordered by reader priority: reusable framework capabilities first,
# then references, teaching examples, tools, plans and exclusions.

# Core processing contracts

[[feature]]
id = "portable-processing"
title = "Portable processor lifecycle"
status = "implemented"
summary = "Validated preparation, variable and zero-frame blocks, reset, deactivation, and atomic rejection with silence on faults."
limits = "One main bus and up to eight auxiliary buses, up to 64 channels per direction, f32/f64 processor specialization; each implementation declares its subset. Public APIs are provisional. Real-time obligations are implementor responsibilities."
sources = ["crates/ravet/src/lib.rs", "crates/ravet-foundation/src/processor.rs"]
tests = ["crates/ravet-foundation/tests/contracts.rs", "examples/gain/tests/processing.rs"]
docs = ["docs/architecture.md", "docs/decisions/0001-portable-processing.md"]

[[feature]]
id = "embedded-foundation"
title = "Allocation-free no_std processing foundation"
status = "implemented"
summary = "Existing portable audio/event/lifecycle/schema contracts work without std or an allocator, with pure-Rust parameter math and target-gated snapshots."
limits = "Default std feature retains desktop mappings; Cargo feature unification applies. Pinned libm 0.2.16; snapshots require native 64-bit atomics. Existing signal/graph/device/editor/runtime crates remain outside this allocator-free subset. Cross checks are library evidence, not board/deadline support."
sources = ["crates/ravet-foundation/Cargo.toml", "crates/ravet-foundation/src/lib.rs", "crates/ravet-foundation/src/parameter.rs"]
tests = ["crates/ravet-foundation/tests/contracts.rs", "crates/ravet-foundation/tests/parameters.rs", "scripts/check-embedded.py"]
docs = ["docs/embedded-projects.md", "docs/decisions/0152-embedded-processing.md"]

[[feature]]
id = "embedded-fixed-block-adapter"
title = "Fixed-capacity embedded audio adaptation"
status = "implemented"
summary = "An explicit no_std adapter owns fixed planar f32 scratch, preflights complete interleaved f32/i16/i32 blocks and preserves event timing, fault silence and backing tails."
limits = "Const channels/frames, exact configured layout, no auxiliary buses/generated events. f32 internal precision; packed 24-bit conversion is consumer-owned. Processor allocation/ownership obligations and hardware drivers/DMA/cache/scheduling remain explicit; no board or deadline guarantee."
sources = ["crates/ravet-embedded/src/lib.rs", "crates/ravet-embedded/Cargo.toml"]
tests = ["crates/ravet-embedded/tests/blocks.rs"]
docs = ["docs/embedded-projects.md", "docs/architecture.md"]

[[feature]]
id = "embedded-reference-bridges"
title = "Embedded gain and native Arduino processing subset"
status = "prototype"
summary = "An allocation-free Rust stereo gain and caller-owned C ABI accompany a header-only C++11 stereo adapter/reference for Arduino cores without a Rust archive."
limits = "Immediate gain 0..4/default unity; Rust reference <=64 frames/eight events, C ABI block-start gain and <=128 samples. Native C++ stereo f32 timed parameters only, no arbitrary Rust DSP export. Matching C/Rust float ABI and pointer/exclusive lifetime obligations; explicit standalone panic policy. Arduino compile/link evidence only; no physical MCU/codec validation, audio-workload suitability or desktop gain parity."
sources = ["examples/embedded-gain/src/lib.rs", "examples/embedded-gain/src/ffi.rs", "examples/embedded-gain/include/RavetEmbeddedGain.h", "embedded/arduino/src/RavetEmbedded.h", "embedded/arduino/examples/OfflineGain/OfflineGain.ino"]
tests = ["examples/embedded-gain/tests/processing.rs", "embedded/tests/bridge.c", "embedded/tests/arduino.cpp", "scripts/check-embedded.py"]
docs = ["docs/embedded-projects.md", "docs/decisions/0152-embedded-processing.md"]

[[feature]]
id = "extended-processing"
title = "Extended processing capabilities"
status = "implemented"
summary = "Portable f32/f64 processor specializations support bounded multichannel/auxiliary buses, borrowed event output and latency/tail declarations; CLAP forwards validated block-start transport."
limits = "64 channels per direction, eight auxiliary buses, caller-owned fixed output capacity. Processors declare their subset; gain supports f32/f64 without auxiliary/generated events, while generic CLAP bridges map native main/aux buses and bounded events. Other-format generic bus/output/latency mappings and mid-block transport remain separate."
sources = ["crates/ravet-foundation/src/audio.rs", "crates/ravet-foundation/src/processor.rs", "crates/ravet-foundation/src/event.rs", "crates/ravet-clap/src/transport.rs", "examples/gain-clap/src/lib.rs"]
tests = ["crates/ravet-foundation/tests/extended_processing.rs", "examples/gain-clap/tests/bridge.rs"]
docs = ["docs/extended-processing.md", "docs/decisions/0017-extended-processing.md"]

[[feature]]
id = "audio-buffers"
title = "Borrowed planar audio buffers"
status = "implemented"
summary = "Safe in-place and separate input/output f32/f64 views validate channel lengths and expose active frames while preserving backing tails; stereo frame mapping selects storage outside the sample loop."
limits = "Borrowed planar views support f32/f64 and multichannel storage. No interleaved view or implicit conversion. Stereo mapper still requires two outputs and at most two inputs."
sources = ["crates/ravet-foundation/src/audio.rs"]
tests = ["crates/ravet-foundation/tests/contracts.rs", "crates/ravet-foundation/tests/stereo_mapping.rs", "examples/gain/tests/processing.rs"]
docs = ["docs/decisions/0001-portable-processing.md", "docs/decisions/0011-stereo-frame-mapping.md"]

[[feature]]
id = "input-events"
title = "Sample-timed input events"
status = "implemented"
summary = "Bounded parameter values/gesture boundaries/modulation amounts, note and validated MIDI short-message events use stable IDs, physical values, ordered offsets, and preserved same-frame order. Zero-frame events use offset zero."
limits = "Bounded output events, UMP codecs/transport and MIDI voice policy are separate capabilities. Gain ignores performance events and unknown parameter IDs; each format bridge declares its mappings."
sources = ["crates/ravet-foundation/src/event.rs", "crates/ravet-foundation/src/processor.rs"]
tests = ["crates/ravet-foundation/tests/contracts.rs", "examples/gain/tests/processing.rs"]
docs = ["docs/decisions/0001-portable-processing.md"]

[[feature]]
id = "transport-context"
title = "Portable transport context"
status = "implemented"
summary = "Process blocks carry optional positions, tempo, playback state, and a discontinuity indication."
limits = "Gain is transport-independent. CLAP forwards validated block-start playing/position/tempo fields and detects seeks across accepted callbacks. Additional details carry validated block-start recording/active-loop/pre-roll, signature, bar and BPM-per-sample increment; no extrapolation or mid-block updates."
sources = ["crates/ravet-foundation/src/event.rs", "crates/ravet-foundation/src/processor.rs"]
tests = ["crates/ravet-foundation/tests/contracts.rs"]
docs = ["docs/architecture.md", "docs/decisions/0002-clap-backend.md"]

[[feature]]
id = "extended-block-start-transport"
title = "Extended block-start transport metadata"
status = "prototype"
summary = "Optional portable details and checked bidirectional CLAP conversion preserve recording, active loop, pre-roll, signature, bar and tempo increment metadata."
limits = "Explicit details availability; CLAP cannot distinguish unknown/false status bits. Positive signature components, finite BPM/sample increment with tempo, bar with beats, active ordered loop bounds per known timeline. Native ingress ignores inactive loop fields; outgoing supplied inactive bounds reject. Sample/fixed-point rounding must preserve order. No extrapolation, DSP reset, mid-block updates or new DAW/device/deadline claim; offline macOS arm64 adapter evidence only."
sources = ["crates/ravet-foundation/src/event.rs", "crates/ravet-clap/src/transport.rs", "crates/ravet-host/src/transport.rs"]
tests = ["crates/ravet-clap/tests/transport.rs", "crates/ravet-host/tests/transport.rs", "examples/gain-clap/tests/bridge.rs"]
docs = ["docs/extended-processing.md", "docs/plugin-hosting.md", "docs/decisions/0127-extended-block-transport.md"]

[[feature]]
id = "instrument-contract"
title = "No-input instrument contract"
status = "implemented"
summary = "Foundation represents mono/stereo instruments without audio inputs; a test instrument exercises note timing and output initialization."
limits = "Contract fixture only; a separate portable sine processor now consumes the contract. No CLAP instrument export."
sources = ["crates/ravet-foundation/src/processor.rs"]
tests = ["crates/ravet-foundation/tests/contracts.rs"]
docs = ["docs/architecture.md"]

[[feature]]
id = "coherent-snapshots"
title = "Bounded coherent word snapshots"
status = "implemented"
summary = "Fixed atomic word arrays provide one-attempt coherent reads, complete publications, and conditional updates that preserve newer control restores."
limits = "Targets with 64-bit atomics only; allocation-free operations do not establish deadlines. Callers encode and validate words and retain the previous snapshot on contention. Coalesces publications, with no event queue or retry policy. Generation must not wrap across an operation."
sources = ["crates/ravet-foundation/src/snapshot.rs"]
tests = ["crates/ravet-foundation/tests/snapshot.rs"]
docs = ["docs/snapshots.md", "docs/decisions/0008-word-snapshots.md"]

# Prepared graphs and audio ownership

[[feature]]
id = "prepared-audio-graphs"
title = "Prepared acyclic processor routing"
status = "prototype"
summary = "Owned portable f32/f64 nodes run in compiled topological order with channel mixing, parallel dry/wet routes, prepared latency compensation, bounded scratch and conservative tail declarations."
limits = "128 nodes, 4096 connections, 65536 frames/path latency, 1024 input/output events per node, 64 MiB graph prepared audio/event storage. Later-node faults can leave preceding state advanced; explicit GraphStatus disables until reset. One selected native precision per graph; no implicit conversion, native discovery, GUI hosting or feedback cycles. Explicit filtered/generated event routes are a separate capability. Prepared whole-graph handoff is a separate capability."
sources = ["crates/ravet-graph/Cargo.toml", "crates/ravet-graph/src/lib.rs"]
tests = ["crates/ravet-graph/tests/routing.rs", "crates/ravet-graph/tests/precision.rs"]
docs = ["docs/audio-graphs.md", "docs/decisions/0029-prepared-audio-graphs.md", "docs/decisions/0055-native-graph-precision.md"]

[[feature]]
id = "prepared-graph-handoff"
title = "Prepared dynamic graph handoff"
status = "implemented"
summary = "One prepared FIFO f32/f64 graph replaces the active graph per valid block, with bounded ownership queues and control-thread retirement."
limits = "1..4 slots per pending/retired queue; exact initial config and path latency required. Retirement backpressure keeps current rendering. No old-history migration, tail drain, crossfade, feedback routing or aggregate graph/node memory guarantee. Endpoint teardown and retired destruction belong outside callbacks; no native deadline claim."
sources = ["crates/ravet-graph/src/dynamic.rs", "crates/ravet-graph/Cargo.toml"]
tests = ["crates/ravet-graph/tests/dynamic.rs"]
docs = ["docs/audio-graphs.md", "docs/decisions/0056-prepared-graph-handoff.md"]

[[feature]]
id = "explicit-graph-events"
title = "Explicit graph event routing"
status = "implemented"
summary = "Filtered host/node generated events share audio/event topology, bounded stable sample-offset merging and complete host output publication."
limits = "4096 event edges, 1024 input/output events per node/host, shared 64 MiB audio/event scratch cap. Duplicate edges duplicate events. Offsets are not audio-latency delayed. Overflow disables graph and clears host outputs; earlier nodes may have advanced. No feedback, automatic state/timing alignment or native deadline claim."
sources = ["crates/ravet-graph/src/events.rs", "crates/ravet-graph/src/lib.rs"]
tests = ["crates/ravet-graph/tests/events.rs"]
docs = ["docs/audio-graphs.md", "docs/decisions/0057-explicit-graph-events.md"]

[[feature]]
id = "explicit-graph-audio-owner-sessions"
title = "Explicit prepared graph audio-owner sessions"
status = "implemented"
summary = "Optional no-op processor session hooks bracket static/dynamic graph processing with non-Send owner guards, reverse stop/rollback and stopped control retirement."
limits = "Explicit opt-in only; existing adapters/unguarded portable behavior unchanged. Start failure must leave its node stopped, prior starts roll back; dynamic rejected candidates retire while old rendering continues. End/retain guards before control transfer/deactivation; no native port/event mapping/device scheduling/migration/crossfade/tail draining/platform/deadline guarantee."
sources = ["crates/ravet-foundation/src/processor.rs", "crates/ravet-graph/src/lib.rs", "crates/ravet-graph/src/dynamic.rs"]
tests = ["crates/ravet-graph/tests/audio_sessions.rs", "crates/ravet-graph/tests/dynamic.rs", "crates/ravet-graph/src/lib.rs", "crates/ravet-graph/src/dynamic.rs"]
docs = ["docs/audio-graphs.md", "docs/architecture.md", "docs/decisions/0107-graph-audio-owner-sessions.md"]

[[feature]]
id = "hosted-clap-f32-main-graph-node"
title = "Prepared CLAP f32 main audio graph node"
status = "implemented"
summary = "Main-activated native audio maps through bounded prepared f32 graph scratch, owner-confined sessions and stopped-token main deactivation/recovery."
limits = "Zero/one main port per direction matching 1..64 channels, frames1..65536, node-owned scratch<=32MiB outside graph cap; no events/auxiliary/editor/active parameter mapping; f64 uses its separate factory. Explicit declared timing, one-shot node after deactivation, consumer core request scheduling and orderly control lifetime. Backend faults may advance histories; no implicit sleep/tail drain/restart/other-format/device scheduling/general third-party/platform/deadline guarantee."
sources = ["crates/ravet-host/src/graph_node.rs", "crates/ravet-host/src/lib.rs", "crates/ravet-host/Cargo.toml", "crates/ravet-foundation/src/processor.rs"]
