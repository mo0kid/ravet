# Standalone audio devices

[[feature]]
id = "standalone-output-devices"
title = "Standalone output audio devices"
status = "prototype"
summary = "Explicit CPAL enumeration/ID selection and configured f32 output streams adapt owned prepared processors through bounded planar scratch; a CLI runs silent callback validation."
limits = "Output-only, 1..64 channels and at most 65,536 scratch frames; no inputs, auxiliary buses, MIDI/events, implicit resampling/conversion, hotplug subscriptions or automatic recovery. macOS UMC1820 20-channel 96 kHz silent callbacks exercised; audible output, latency, deadlines and other targets remain unvalidated."
sources = ["crates/ravet-device/Cargo.toml", "crates/ravet-device/src/lib.rs", "tools/device-probe/Cargo.toml", "tools/device-probe/src/main.rs"]
tests = ["crates/ravet-device/tests/output.rs", "tools/device-probe/src/main.rs"]
docs = ["docs/audio-devices.md", "docs/decisions/0018-output-devices.md"]

[[feature]]
id = "input-duplex-devices"
title = "Input capture and FIFO duplex effects"
status = "prototype"
summary = "Explicit CPAL f32 input streams publish whole-frame prefixes to a prepared ring; duplex rendering zero-fills underflow, partitions variable callbacks and feeds portable effects."
limits = "1..64 channels per direction, power-of-two ring 1..65536 frames, scratch up to 65536. Matching nominal rates, independently clocked/sequential streams; no drift compensation or sample-exact alignment. No automatic recovery, hotplug or MIDI/events; hidden-producer automatic recording integration is exercised synthetically, without physical recording validation."
sources = ["crates/ravet-device/src/input.rs", "crates/ravet-device/src/lib.rs", "tools/device-probe/src/main.rs"]
tests = ["crates/ravet-device/tests/recording_worker.rs", "crates/ravet-device/tests/input.rs", "crates/ravet-device/tests/output.rs", "crates/ravet-device/src/lib.rs", "tools/device-probe/src/main.rs"]
docs = ["docs/audio-devices.md", "docs/decisions/0028-input-duplex-devices.md"]

[[feature]]
id = "explicit-clocked-duplex"
title = "Prepared explicit clocked duplex conversion"
status = "implemented"
summary = "Opt-in FIFO-depth feedback drives aligned per-input-channel sinc conversion into the output-clock processor, with priming and underrun recovery."
limits = "Explicit f32 1..64-channel devices/rates8000..192000 and corrected sinc ratio1/16..16; scratch1..65536/taps16..256 even, power-of-two ring2..65536 matching clock capacity. Sequential streams, independent telemetry, no sample alignment/fallback/hotplug/automatic recovery/events/recording/universal stability/long-session hardware drift/deadline guarantee."
sources = ["crates/ravet-device/src/clocked.rs", "crates/ravet-device/src/input.rs", "crates/ravet-device/src/lib.rs", "tools/device-probe/src/main.rs"]
tests = ["crates/ravet-device/tests/clocked.rs", "crates/ravet-device/tests/input.rs", "tools/device-probe/src/main.rs"]
docs = ["docs/audio-devices.md", "docs/decisions/0104-clocked-duplex.md"]

[[feature]]
id = "explicit-output-recovery"
title = "Caller-scheduled exact-device output recovery"
status = "prototype"
summary = "An explicit control-thread owner preserves healthy f32 output, releases missing/failed streams and prepares/starts fresh DSP through a caller-supplied factory."
limits = "Exact host-local ID 1..4096 bytes/no NUL, fixed existing f32 config/scratch limits; no fallback/settings mutation/timer/hotplug subscription/state migration/clock compensation/duplex or native plugin scheduling. Backend work can block; errors retry only on service. Controlled transitions and UMC1820 silent manual restart evidence, physical unplug/real backend fault/other-platform/deadline unvalidated."
sources = ["crates/ravet-device/src/recovery.rs", "crates/ravet-device/src/lib.rs", "tools/device-probe/src/main.rs"]
tests = ["crates/ravet-device/src/recovery.rs", "crates/ravet-device/tests/output.rs", "tools/device-probe/src/main.rs"]
docs = ["docs/audio-devices.md", "docs/decisions/0090-explicit-output-recovery.md"]

[[feature]]
id = "explicit-duplex-recovery"
title = "Caller-scheduled exact-pair duplex recovery"
status = "prototype"
summary = "An explicit control-thread owner releases both streams when either exact device disappears or either backend fails, reopening fresh FIFO/DSP through a caller factory."
limits = "Fixed f32 1..64-channel matching-rate configs, scratch 1..65536, power-of-two ring 1..65536; exact IDs 1..4096 bytes/no NUL. No fallback/settings mutation/timer/hotplug subscription/state migration/clock compensation/recording or native plugin scheduling. Controlled transitions and silent UMC1820 manual pair restarts only; physical removal/real backend failure/drift/other-platform/deadline unvalidated."
sources = ["crates/ravet-device/src/recovery.rs", "crates/ravet-device/src/lib.rs", "tools/device-probe/src/main.rs"]
tests = ["crates/ravet-device/src/recovery.rs", "crates/ravet-device/tests/input.rs", "tools/device-probe/src/main.rs"]
docs = ["docs/audio-devices.md", "docs/decisions/0091-explicit-duplex-recovery.md"]

[[feature]]
id = "reclaimable-clocked-duplex"
title = "Explicit paired clocked callback retirement and original-owner recovery"
status = "prototype"
summary = "An additive f32 paired CPAL route retains the unique prepared clocked renderer and matching capture endpoints until all four callbacks retire, then allows stopped file/DSP extraction and explicit owner-preserving recovery."
limits = "No new dependency/defaults; existing clocked rate/channel/ring/frame/corrected-sinc profile. Failure-owned prepared constructors preserve original P/raw consumer; fallible scratch before child prepare; legacy consuming signatures unchanged, failed-prepare inactive contract. One control retirement worker; disjoint private UnsafeCell capture/renderer, unique non-Clone FnMut data guards, two atomic-only error guards, no Weak/public clones. All FOUR Acquire retirement flags plus stable sole strong ownership before extraction; callback Arc field Drop cannot be inferred from flags. Framework capture Drop only publishes flag/releases non-last Arc; no producer/consumer/DSP/scratch/counter disposal there, including early receiver Drop/asynchronous native owners. Native CPAL/OS locks/closure allocation/destructors and panic runtime remain separate limits. Nonblocking poll; explicit CONTROL wait without deadline/cancellation. Original spawn/input/output/preparation/start errors retain Immediate/Pending ownership, no hidden retry. Caught polling fault returns exclusive stopped owner; foreign lifecycle/restore panic may lose recovery, no forged receipt. Capture/output panic disables its guard, histories exceptional. Stopped result exposes no render/mutable child and consumes into original P and matching raw consumer/PreparedCapture, once-only deactivate; converted/prefetched histories discarded CONTROL, queued raw cursor unchanged. Explicit selected-ID recovery Owned/Live/Retiring/Disabled, known live callback faults retire before selection, healthy selection errors retain pair/original error without absence inference; no enumerate/open/restore while pending or disabled; after proof restore original P/receipt before fresh pair. Normal restore errors retain actual mutated P/receipt; successful restore once, failed opens preserve ownership, generation advances only after successful start. No automatic timer/fallback/subscription/state migration; ordinary DSP faults explicit reset/reopen policy. All24 Drop orders, actual concurrent capture/render and Wave/IntegerSinc/indexed-worker/W215 stopped failed/successful seek17/reprepare/exact suffix/drain qualified offline. Two short silent paired CoreAudio cycles on one USB interface prove original-owner retirement/reopen only; no acoustic validation, synchronized starts, timestamp alignment, live mailbox, physical hotplug/drift, long-session latency, callback/teardown deadline or broad device/platform claim."
sources = ["crates/ravet-device/src/lib.rs", "crates/ravet-device/src/input.rs", "crates/ravet-device/src/clocked.rs", "crates/ravet-device/src/reclaimable_clocked.rs", "crates/ravet-device/src/reclaimable_clocked_recovery.rs"]
tests = ["crates/ravet-device/src/reclaimable_clocked_tests.rs", "crates/ravet-device/src/reclaimable_clocked_recovery_tests.rs", "crates/ravet-device/tests/buffered_file_duplex.rs", "crates/ravet-device/tests/indexed_buffered_output.rs", "tools/device-probe/src/bin/reclaimable-clocked-duplex.rs"]
docs = ["docs/audio-devices.md", "docs/audio-files.md", "docs/decisions/0231-reclaimable-clocked-duplex-ownership.md"]

[[feature]]
id = "explicit-clocked-duplex-recovery"
title = "Caller-scheduled exact clocked duplex recovery"
status = "implemented"
summary = "Exact device-pair service releases unhealthy/missing streams and reopens fresh FIFO, conversion/controller and factory-owned processors with shared recovery ownership."
limits = "Fixed f32 clocked configuration bounds; IDs1..4096 bytes/no NUL, explicit control-thread cadence/backoff. No fallback/settings mutation/timer/hotplug subscription/state migration/recording/native plug-in lifecycle or physical fault/long-session drift/deadline guarantee. Ordinary FIFO shortages/drops and processor faults alone do not reopen."
sources = ["crates/ravet-device/src/recovery.rs", "crates/ravet-device/src/clocked.rs", "crates/ravet-signal/src/resampling.rs", "tools/device-probe/src/main.rs"]
tests = ["crates/ravet-device/tests/clocked.rs", "crates/ravet-device/src/recovery.rs", "crates/ravet-signal/tests/variable_resampling.rs", "tools/device-probe/src/main.rs"]
docs = ["docs/audio-devices.md", "docs/signal-processing.md", "docs/decisions/0105-clocked-duplex-recovery.md"]

