status = "implemented"
summary = "Worker pumps retain decoded suffixes under ring backpressure, discard old playback generations on stopped seek and drain input capture to bounded WAV recording with explicit finalization."
limits = "WAV only, prepared worker scratch; stopped seek borrows matching endpoints. Recording errors poison after dequeue, finish requires stopped producer. No implicit thread/device/path/capture permission, live seek, automatic transport or physical recording/deadline claim."
sources = ["crates/ravet-audio-file/src/buffered.rs", "crates/ravet-audio-file/src/ring.rs", "crates/ravet-audio-file/src/wave.rs"]
tests = ["crates/ravet-audio-file/tests/buffered.rs", "crates/ravet-device/tests/input.rs"]
docs = ["docs/audio-files.md", "docs/decisions/0033-buffered-wave-workers.md"]

[[feature]]
id = "compressed-worker-read-ahead"
title = "Compressed prepared-ring read-ahead"
status = "implemented"
summary = "Explicit worker pump streams compressed decoded frames into the prepared SPSC ring, retaining backpressure suffixes and clearing old generations only after successful stopped seeks."
limits = "Matching channels, 1..65536 scratch frames; rate/clock/thread/device scheduling explicit. Decoder faults poison; earlier queued/consumed audio cannot roll back. Decode/replay/destruction outside callbacks; consumer pop alone is prepared."
sources = ["crates/ravet-audio-file/src/compressed_buffered.rs", "crates/ravet-audio-file/src/compressed_stream.rs", "crates/ravet-audio-file/src/ring.rs"]
tests = ["crates/ravet-audio-file/tests/compressed_buffered.rs"]
docs = ["docs/audio-files.md", "docs/decisions/0069-compressed-read-ahead.md"]

[[feature]]
id = "automatic-recording-workers"
title = "Automatic recorder worker ownership and explicit finish"
status = "implemented"
summary = "A control-owned automatic worker drives existing WAV/AIFF/FLAC bounded capture-ring recorders, retaining original errors/source ownership and validating reclaimed matching producer identity before bounded final drain/file finalization, including permanent hidden-producer retirement; callback capture remains prepared accepted-prefix push."
limits = "Explicit start/stop and source format/scratch/output/count budgets; 2 ms empty-ring polling timeout, worker-specific allocations/I/O and cooperative control-only join/drop without cancellation/deadline guarantee. Producer must be stopped/reclaimed or permanently retired before finish; live/leaked producer retirement checks reject before stopping; concurrent late publication can reject or lose audio. Pump faults retain poisoned recorder/original error; consuming finalization errors and worker panic lose their sink/source and cannot claim a complete file. No physical capture/device/path/clock/drift/resampling or callback blocking/automatic drop-policy claim."
sources = ["crates/ravet-audio-file/src/recording.rs", "crates/ravet-audio-file/src/background.rs", "crates/ravet-audio-file/src/ring.rs", "crates/ravet-audio-file/src/buffered.rs", "crates/ravet-audio-file/src/aiff_buffered.rs", "crates/ravet-audio-file/src/flac_recorder.rs"]
tests = ["crates/ravet-audio-file/tests/recording.rs", "crates/ravet-device/tests/recording_worker.rs", "crates/ravet-audio-file/tests/automatic.rs", "crates/ravet-audio-file/tests/buffered.rs", "crates/ravet-audio-file/tests/aiff_buffered.rs", "crates/ravet-audio-file/tests/flac_recorder.rs"]
docs = ["docs/audio-files.md", "docs/decisions/0177-automatic-recording-workers.md"]

[[feature]]
id = "automatic-read-ahead-playback"
title = "Automatic read-ahead ownership and buffered playback"
status = "implemented"
summary = "A control-owned automatic worker drives WAV/AIFF/compressed read-ahead with retained backpressure; its prepared callback endpoint provides pause/play, consumed-source position, underrun silence and drained EOF. Matching stopped seek/stop joins, positions and restarts the source; shutdown reclaims source and original error."
limits = "Explicit start and source-rate/channel playback; 1..65,536 render frames and existing ring/scratch/source bounds. Worker uses a 2 ms polling park timeout, source-specific allocations/I/O and cooperative join without cancellation/deadline guarantees. Control-only seek/stop/drop/join; no callback mailbox/live seek/streamed loop/crossfade/resampling or physical device/clock/recording guarantee. Pump/thread failures are distinct from EOF; restart failure cannot roll back completed seek generations; worker panic loses its unwound source. Custom ReadAheadPump implementations own bounded pumping, matching ownership and failed-seek contracts."
sources = ["crates/ravet-audio-file/src/automatic.rs", "crates/ravet-audio-file/src/background.rs", "crates/ravet-audio-file/src/buffered.rs", "crates/ravet-audio-file/src/compressed_buffered.rs", "crates/ravet-audio-file/src/aiff_buffered.rs"]
tests = ["crates/ravet-audio-file/tests/automatic.rs", "crates/ravet-audio-file/tests/aiff_buffered.rs"]
docs = ["docs/audio-files.md", "docs/decisions/0171-automatic-read-ahead-playback.md"]

[[feature]]
id = "aiff-pcm-worker-adapters"
title = "AIFF PCM read-ahead and recording adapters"
status = "implemented"
summary = "Concrete AIFF read-ahead and recorder wrappers share prepared PCM handoff mechanics with WAV, retain backpressure suffixes, preserve stopped seek generations and finalize bounded ring drains; automatic worker/playback ownership accepts AIFF sources."
limits = "AIFF uncompressed PCM16/24/32 and existing stream/FORM bounds; matching channels and 1..65,536 scratch frames within reader capacity. Worker/control-only file I/O/seek/finish/drop; stopped producer required before one-ring-capacity final drain. Dequeued recording validation/write failures poison future pump/finish and may leave partial files. No AIFF-C/metadata/markers/new widths/resampling/device/path/physical recording/deadline guarantee."
sources = ["crates/ravet-audio-file/src/aiff_buffered.rs", "crates/ravet-audio-file/src/pcm_buffered.rs", "crates/ravet-audio-file/src/buffered.rs"]
tests = ["crates/ravet-audio-file/tests/aiff_buffered.rs", "crates/ravet-audio-file/tests/buffered.rs", "crates/ravet-audio-file/tests/automatic.rs", "crates/ravet-audio-file/tests/aiff.rs"]
docs = ["docs/audio-files.md", "docs/decisions/0173-aiff-pcm-worker-adapters.md"]

