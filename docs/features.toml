[[feature]]
id = "standalone-settings-popup"
title = "Default standalone Audio/MIDI settings popup"
status = "prototype"
summary = "Reusable main-thread standalone windows resize their embedded page with native content and include a native title-bar settings button and standard device/channel-pair/rate/buffer/MIDI checklist popup with persistent exact device selections by default, with explicit full opt-out."
