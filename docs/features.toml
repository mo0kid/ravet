title = "Reusable parameter schema and state"
status = "implemented"
summary = "Borrowed parameter schemas provide stable IDs, validated linear/logarithmic and discrete mappings, fixed-size complete state records, and explicit ID-based migration."
limits = "Bounded caller-selected portable schema size and product-owned version/semantic migration policy. Product-specific CLAP gain/bypass integration exists; host transport remains product-owned, with reusable UI attachments available separately; no preset discovery."
sources = ["crates/ravet-foundation/src/parameter.rs", "examples/gain/src/state.rs"]
tests = ["crates/ravet-foundation/tests/parameters.rs", "examples/gain/tests/parameters.rs"]
docs = ["docs/parameters.md", "docs/decisions/0010-parameter-state-and-meters.md"]

[[feature]]
id = "observable-state"
title = "Observable hierarchical state and undoable presets"
status = "implemented"
summary = "An explicit control-thread store provides stable-ID trees, atomic grouped edits, bounded undo/redo, revision subscriptions with resync, and deterministic complete product-identified preset records."
limits = "Allocates/clones on control threads; up to 4096 nodes, depth 64, 16 MiB state/transaction payload, 128 history snapshots/journal batches. Poll cursors belong to one store. No preset file discovery, migration, host programs or audio-thread delivery."
sources = ["crates/ravet-state/Cargo.toml", "crates/ravet-state/src/lib.rs"]
tests = ["crates/ravet-state/tests/state.rs"]
docs = ["docs/observable-state.md", "docs/decisions/0024-observable-state.md"]

[[feature]]
id = "preset-file-libraries"
title = "Explicit preset-file libraries"
status = "implemented"
summary = "Consumer-selected directories provide sorted bounded preset metadata, validated atomic replacement and complete undoable selected-file recall through observable state."
limits = "4096 directory entries, 128-byte portable ASCII stems, product-tagged tree codec/library/destination bounds. Blocking/allocating runtime dependency outside portable umbrella; no watcher, categories/Unicode titles, host program/discovery extension, rename/delete or power-loss/platform/DAW claim."
sources = ["crates/ravet-preset/Cargo.toml", "crates/ravet-preset/src/lib.rs"]
tests = ["crates/ravet-preset/tests/library.rs"]
docs = ["docs/preset-files.md", "docs/decisions/0035-explicit-preset-files.md"]

[[feature]]
id = "complete-parameter-programs"
title = "Immutable complete parameter program banks"
status = "implemented"
summary = "Borrowed catalogues validate complete canonical parameter states with unique stable IDs/MIDI addresses and bounded heap-free lookup/copy."
limits = "1..128 programs, 1..1024 parameters, <=65536 values; names <=255 UTF8 bytes/no NUL, bank 0..16383/number 0..127. Consumer owns publication, current identity, persistence, host registration/notifications and DSP/voice switching."
sources = ["crates/ravet-foundation/src/program.rs", "crates/ravet-foundation/src/lib.rs"]
tests = ["crates/ravet-foundation/tests/programs.rs", "crates/ravet-instrument/tests/programs.rs"]
docs = ["docs/parameters.md", "docs/decisions/0080-complete-program-banks.md"]

[[feature]]
id = "parameter-attachments"
title = "Reusable UI parameter attachments"
status = "implemented"
summary = "Stable-ID attachments borrow validated metadata, map physical/normalized linear/logarithmic/discrete input, refresh host values without feedback, and submit explicit gestures through a product transport trait."
limits = "UI-thread mechanism only; no widgets, automatic subscriptions, scheduling or transport ownership. Owners explicitly end active gestures. Failed transport calls preserve gesture ownership; displayed values change only on refresh. Gain CLAP integrates the layer as a prototype."
sources = ["crates/ravet-surface/src/attachment.rs", "crates/ravet-surface/src/lib.rs", "examples/gain-clap/src/gui.rs", "examples/gain-clap/src/lib.rs"]
tests = ["crates/ravet-surface/tests/attachments.rs", "examples/gain-clap/src/control_tests.rs", "tools/editor-smoke/src/main.rs"]
docs = ["docs/parameter-attachments.md", "docs/decisions/0016-attachments-and-resizing.md"]

# MIDI, expression and OSC

[[feature]]
id = "midi-short-messages"
title = "Portable MIDI 1.0 short messages"
status = "implemented"
summary = "Validated wire-preserving channel/system messages decode controllers, pitch bend and pressure; a nonallocating running-status decoder handles interleaved real-time messages and timed processor events."
limits = "Short-message decoder only. SysEx start reports unsupported and payload is skipped until recovery; UMP and voice policy are separate APIs. No files, device clocks or backend delivery in this decoder. Gain ignores MIDI; generic CLAP mapping is separate."
sources = ["crates/ravet-foundation/src/midi.rs", "crates/ravet-foundation/src/event.rs"]
tests = ["crates/ravet-foundation/tests/midi.rs"]
docs = ["docs/midi.md"]

[[feature]]
id = "midi2-channel-voice"
title = "Full-resolution MIDI 2.0 channel voice"
status = "implemented"
summary = "Typed MT=4 channel voice encoding/decoding preserves velocity, controller and per-note resolution with explicit group/channel addressing."
limits = "Codec only. Reserved bits are ignored on reception and canonicalized on encoding; unknown attributes retained. No protocol/profile negotiation, MIDI 1.0 conversion, native UMP delivery or synthesis integration."
sources = ["crates/ravet-foundation/src/midi2.rs"]
tests = ["crates/ravet-foundation/tests/midi2.rs"]
docs = ["docs/midi.md", "docs/decisions/0050-midi2-channel-voice.md"]

[[feature]]
id = "ump-framing"
title = "Fixed-storage UMP framing"
status = "implemented"
summary = "Exact one-to-four-word packets, incremental framing, opaque reserved payloads and explicit big-endian serialization."
limits = "Framing only; no semantic validation, SysEx assembly, protocol negotiation, processor event mapping or native UMP delivery. Byte order is explicitly chosen by the consumer."
sources = ["crates/ravet-foundation/src/ump.rs"]
tests = ["crates/ravet-foundation/tests/ump.rs"]
docs = ["docs/midi.md", "docs/decisions/0049-ump-framing.md"]

[[feature]]
id = "ump-short-sysex"
title = "UMP short messages and SysEx assembly"
status = "implemented"
summary = "MIDI 1.0 UMP short-message codecs, SysEx7/SysEx8 payload chunks and caller-buffer single-stream assembly with explicit abort and atomic rejection."
limits = "Payload codecs only. Consumers route concurrent streams, enforce whole-stream SysEx7 interspersing rules and interpret manufacturer/profile data. No protocol conversion, negotiated stream limits, timestamps or native UMP delivery."
sources = ["crates/ravet-foundation/src/ump.rs", "crates/ravet-foundation/src/ump_sysex.rs"]
tests = ["crates/ravet-foundation/tests/ump.rs", "crates/ravet-foundation/tests/ump_sysex.rs"]
docs = ["docs/midi.md", "docs/decisions/0051-ump-short-sysex.md"]

[[feature]]
id = "midi-voice-allocation"
title = "Bounded MIDI voice allocation and configured expression"
status = "implemented"
summary = "Fixed 1..128-slot voice ownership provides deterministic stealing, duplicate note-off matching, sustain/sostenuto, pressure/bend/timbre snapshots and configured lower/upper member expression with separate master pressure/timbre."
limits = "Receiver policy only; no DSP/instrument export, implicit negotiation (explicit single-zone receiver is separate), overlapping zones or MIDI-CI; master/member pressure and timbre stay separate for consumer combination. Released tails freeze expression; configured channel reuse releases prior notes. Caller owns release completion."
sources = ["crates/ravet-instrument/Cargo.toml", "crates/ravet-instrument/src/lib.rs"]
tests = ["crates/ravet-instrument/tests/voices.rs", "crates/ravet-instrument/src/lib.rs"]
docs = ["docs/midi.md", "docs/decisions/0027-midi-voice-ownership.md"]

[[feature]]
id = "native-performance-voice-ownership"
title = "Bounded normalized performance voice ownership"
status = "implemented"
summary = "A separate fixed receiver preserves optional full-u32 note IDs, unquantized velocities and seven exact f64 expressions, with conjunctive targets, explicit retrigger/release/steal/choke/completion and complete timed semantic preflight."
limits = "One already routed endpoint, 1..128 slots, at most 1024 events/65536 frames per preflight. Same-ID address changes reject until completion/reset. Expressions update release tails; defaults are receiver policy. No MIDI/UMP/pedals, smoothing, DSP, implicit output reservation/publication or format export. Consumers budget later DSP completions and retain exclusive ownership. Local heap checks do not prove deadlines or DAW/platform support."
sources = ["crates/ravet-instrument/src/performance.rs", "crates/ravet-instrument/src/lib.rs"]
tests = ["crates/ravet-instrument/tests/performance.rs"]
docs = ["docs/midi.md", "docs/decisions/0163-native-performance-voice-ownership.md"]

[[feature]]
id = "two-zone-mpe-voices"
title = "Two-zone MPE voice receiver"
status = "implemented"
summary = "A fixed shared voice pool negotiates lower/upper zones with latest-overlap precedence, shared-channel/master notes, independent zone ranges and post-note-off expression rules."
limits = "1..128 shared slots; every accepted configuration clears all zones' notes/controllers/tails. Integer ranges 0..96; both-disabled polyphonic fallback, unassigned channels ignored when active. Pressure/timbre combination belongs to DSP. Sound catalogue/commit/mode/other-pedal/MIDI-CI and native conformance remain separate; existing sine uses legacy single-zone policy."
sources = ["crates/ravet-instrument/src/receiver.rs", "crates/ravet-instrument/src/lib.rs"]
tests = ["crates/ravet-instrument/tests/receiver.rs"]
docs = ["docs/midi.md", "docs/decisions/0059-two-zone-mpe-receiver.md"]

[[feature]]
id = "single-zone-rpn-negotiation"
title = "Opt-in single-zone MIDI RPN negotiation"
status = "implemented"
summary = "Per-channel RPN decoding drives explicitly selected lower/upper zone configuration, master/member whole-semitone bend ranges and live voice snapshots."
limits = "One chosen zone, 1..128 voices, 0..15 members; accepted zone changes kill all slots/controllers and reset bend ranges. No fractional range negotiation, polyphonic RPN0, NRPN data/increments, overlapping zones, MIDI-CI or synth/format export; master/member pressure/timbre are separate snapshots."
sources = ["crates/ravet-instrument/src/negotiation.rs"]
tests = ["crates/ravet-instrument/tests/negotiation.rs"]
docs = ["docs/midi.md", "docs/decisions/0037-single-zone-negotiation.md"]

[[feature]]
id = "sostenuto-voice-ownership"
title = "Captured sostenuto voice ownership"
status = "implemented"
summary = "CC66 rising edges capture held notes with independent sustain release, channel/MPE-zone isolation and sample-timed sine integration."
limits = "1..128 fixed slots, binary >=64 threshold, held notes only; repeated on does not recapture. Master-only in MPE, including compatibility notes. No other/half pedals, piano model, native controller/DAW conformance or MIDI2 pedal policy."
sources = ["crates/ravet-instrument/src/lib.rs", "crates/ravet-instrument/src/receiver.rs", "crates/ravet-instrument/src/synthesis.rs"]
tests = ["crates/ravet-instrument/tests/pedals.rs", "crates/ravet-instrument/tests/synthesis.rs", "examples/sine-clap/tests/support/mod.rs"]
docs = ["docs/midi.md", "docs/decisions/0079-sostenuto-ownership.md"]

[[feature]]
id = "midi-program-requests"
title = "Staged MIDI bank and program requests"
status = "implemented"
summary = "Sixteen fixed channel selectors stage CC0/32 and emit exact bank/program requests on Program Change, preserving pending/request distinction."
limits = "MIDI1 only; zero-based bank/program, repeated PC emits again. CC120/121/123 preserve bank/request; explicit/System Reset clears. No availability/commit, MPE routing, files, host mapping, voice/DSP policy or implicit scheduling."
sources = ["crates/ravet-instrument/src/program.rs", "crates/ravet-instrument/src/lib.rs"]
tests = ["crates/ravet-instrument/tests/programs.rs"]
docs = ["docs/midi.md", "docs/decisions/0080-complete-program-banks.md"]

[[feature]]
id = "mpe-program-requests"
title = "Master-routed MPE program requests"
status = "implemented"
summary = "Negotiated single-/two-zone receivers return independently staged master program requests without changing voices; ordinary polyphony retains per-channel requests."
limits = "MIDI1 requests only, no sound commit/current identity. Active member/unassigned channels ignored; any accepted RPN6/reset clears every bank/request, RPN0/CC121 preserve. Sine consumes chosen-master requests; native controller/DAW/host menu/MIDI2 conformance remains separate."
sources = ["crates/ravet-instrument/src/negotiation.rs", "crates/ravet-instrument/src/receiver.rs", "crates/ravet-instrument/src/synthesis.rs"]
tests = ["crates/ravet-instrument/tests/programs.rs", "crates/ravet-instrument/tests/synthesis.rs", "examples/sine-clap/tests/support/mod.rs"]
docs = ["docs/midi.md", "docs/decisions/0082-mpe-program-requests.md"]

[[feature]]
id = "prepared-ump-device-handoff"
title = "Prepared UMP device packet handoff"
status = "implemented"
summary = "Unique SPSC endpoints preserve framed numeric words, explicit protocol labels and opaque timestamps with whole-batch framing preflight and bounded prefix delivery."
limits = "1..4096 packets, 4096 words per batch; malformed whole batches publish nothing, full/abandoned suffix discarded. Protocol/clock semantics belong to native producers. Construction/drop outside callbacks; no native device connection or deadline claim."
