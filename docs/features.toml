# Reusable editors, controls and drawing

[[feature]]
id = "native-web-editor"
title = "Native web editor backends"
status = "prototype"
summary = "Local HTML editors use Cocoa/WebKit, Windows HWND/WebView2 or Linux X11/WebKitGTK with finite backing colours, bounded JSON messages, coalesced snapshots and explicit teardown. Cocoa editor views accept initial drags from inactive windows. WebKit browser context menus are suppressed in all frames while consumer right-click actions still receive events."
limits = "C++ API on all three platforms; the separate Cargo Rust binding remains macOS only. Caller owns the UI loop and callback lifetime. Linux requires GTK3 X11/XWayland, WebKitGTK 4.1 >=2.40 and UI-thread GLib pumping; an existing Wayland GTK context is rejected. Loaded SWELL hosts must provide cooperative LOAD_GTK initialization or editor creation is rejected. Windows requires the WebView2 loader and installed runtime; creation is asynchronous. 50 ms polling, one evaluation in flight, 65,536-byte JSON and 1 MiB inline HTML limits. WebKit context-menu suppression has no native opt-out; macOS synthetic DOM evidence only, Linux runtime validation pending. Windows context-menu policy is unchanged. Linux software painting is selectable with RAVET_WEB_LINUX_SOFTWARE_RENDERING (default OFF); UI CPU cost is unmeasured. Linux lifecycle evidence in local Ubuntu containers and native Omarchy/XWayland, Windows compile evidence only, macOS native probes; no DAW or deadline support claim."
sources = ["crates/ravet-surface/native/RavetWebView.h", "crates/ravet-surface/native/RavetWebView.mm", "crates/ravet-surface/native/RavetWebViewLinux.cpp", "crates/ravet-surface/native/RavetWebViewWindows.cpp", "crates/ravet-surface/native/mingw/EventToken.h", "crates/ravet-surface/native/CMakeLists.txt"]
tests = ["crates/ravet-surface/native/tests/lifecycle.mm", "crates/ravet-surface/native/tests/context-menu.mm", "crates/ravet-surface/native/tests/context-menu.html", "crates/ravet-surface/native/tests/first-mouse.mm", "crates/ravet-surface/native/tests/editor.html", "crates/ravet-surface/native/tests/portable.cpp", "crates/ravet-surface/native/tests/portable.html", "crates/ravet-surface/native/tests/linux-host-gtk.cpp", "crates/ravet-surface/native/tests/linux-host-gtk-shim.cpp", "crates/ravet-surface/native/tests/linux-paint.cpp"]
docs = ["docs/native-editor.md", "docs/decisions/0005-native-web-editor.md", "docs/decisions/0014-cross-platform-native-web.md", "docs/decisions/0205-webkit-context-menus.md"]

[[feature]]
id = "native-editor-binding"
title = "Cargo macOS WebKit ownership binding"
status = "prototype"
summary = "An explicit native crate builds Cocoa/WebKit through Xcode, checks main-thread creation, owns view and callback context, copies bounded snapshots and destroys native callback machinery before releasing state."
limits = "macOS only; Xcode build host required, native deployment target 12. View is not Send/Sync; caller supplies run loop and a valid live NSView parent through a documented unsafe attach. macOS owned-view resizing is available. No portable widgets, x86_64/macOS-12 runtime, native heap or DAW support claim."
