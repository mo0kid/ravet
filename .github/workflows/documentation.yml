name: Documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref supersedes a queued or running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Self-hosted Arch Linux runner `omarchy`. Uses the machine's python3 (the
  # checker needs only the standard library); setup-python has no Arch builds.
  documentation-checks:
    name: Documentation checks
    runs-on: [self-hosted, linux, omarchy]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check catalogue and local links
        run: python3 scripts/check-docs.py
      - name: Test documentation checker
        run: python3 -m unittest discover -s scripts/tests -v

  # MANUAL while GitHub-hosted Actions minutes are unavailable: runs only on
  # workflow_dispatch or pull_request, not on every push. It stays on macOS
  # because a Linux Rustdoc build omits the macOS-only API (ravet_webview's
  # StandaloneWindow/WebView, ravet_metal, ravet_media, ravet_core_midi). The
  # Linux runtime job still checks warning-free Rustdoc on every push.
  # Restore by deleting the `if:` line once hosted minutes are available, or
  # use a self-hosted macOS runner: runs-on: [self-hosted, macOS].
  api-reference:
    name: API reference
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: target
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Test API examples
        run: cargo +stable test --workspace --doc --locked
      - name: Build API reference
        run: cargo +stable doc --workspace --no-deps --locked
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Install documentation tooling
        run: python3 -m pip install -r scripts/docs/requirements.txt
      - name: Build strict combined documentation site
        run: python3 scripts/docs.py build
      - name: Upload documentation portal
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ravet-documentation-site
          path: target/docs-site/
          if-no-files-found: error
          retention-days: 14
      - name: Upload API reference
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ravet-api-reference
          path: target/doc/
          if-no-files-found: error
          retention-days: 14
