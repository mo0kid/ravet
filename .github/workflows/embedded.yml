name: Embedded processing contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref supersedes a queued or running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: '8'

jobs:
  # Self-hosted Arch Linux runner `omarchy` for pushes; the runner's .env
  # supplies an isolated RUSTUP_HOME/CARGO_HOME and a shared CARGO_TARGET_DIR.
  # Pull requests, including untrusted forks, use a GitHub-hosted Ubuntu runner.
  contracts:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "omarchy"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust and library targets
        run: rustup toolchain install stable --profile minimal --target thumbv6m-none-eabi,thumbv7em-none-eabihf,aarch64-unknown-linux-gnu,armv7-unknown-linux-gnueabihf
      - name: Select stable Rust
        run: rustup default stable
      - name: Check native contracts and cross-target libraries
        run: python3 scripts/check-embedded.py --cross
      - name: Check independent project generation
        run: python3 -m unittest discover -s scripts/tests -p test_projects.py -v
