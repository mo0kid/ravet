<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAVET paragraph workspace</title>
<style>body{font:16px system-ui;color:#203e60;background:#eef2f6;margin:20px}h1{font-size:1.65rem;margin:0 0 10px}.controls{display:flex;flex-wrap:wrap;gap:10px 20px;max-width:920px}label{display:flex;align-items:center;gap:6px}select,button{font:inherit;padding:5px 8px}button{cursor:pointer}button:disabled{cursor:default}#picture{background:white;border:1px solid #75889f;max-width:920px;margin-top:18px;padding:0;min-height:64px}#picture img{display:block;max-width:100%;height:auto}#source{white-space:pre-wrap;max-width:920px;overflow-wrap:anywhere}#font-source,#status{max-width:920px}:focus-visible{outline:3px solid #176cd2;outline-offset:3px}</style>
<body><h1>Paragraph workspace</h1><p>Explore wrapping and reading direction while keeping complete characters in their selected fonts.</p>
<div class="controls"><label for="sample">Sample <select id="sample"><option value="0">Mixed Latin and Arabic</option><option value="1">Arabic and marks</option><option value="2">Directional isolate</option><option value="3">Hard line breaks</option><option value="4">Accents and ligatures</option><option value="5">Missing characters</option><option value="6">Empty paragraph</option><option value="7">Long unbroken word</option><option value="8">Large document</option></select></label>
<label for="width">Line width <select id="width"><option>80</option><option>160</option><option selected>320</option><option>640</option></select></label>
<label for="size">Text size <select id="size"><option value="0">14</option><option value="1" selected>20</option><option value="2">28</option></select></label>
<label for="direction">Base direction <select id="direction"><option value="0">Left to right</option><option value="1">Right to left</option></select></label>
<label for="alignment">Alignment <select id="alignment"><option value="0">Left</option><option value="1">Center</option><option value="2">Right</option></select></label>
<label for="mode">Rendering <select id="mode"><option value="0">Vector</option><option value="1">Pixels</option></select></label>
<button type="button" id="narrower">Narrower</button><button type="button" id="wider">Wider</button><button type="button" id="direction-toggle">Change reading direction</button><button type="button" id="next-sample">Next sample</button></div>
<button type="button" id="refresh">Refresh current view</button><p id="font-source"></p><div id="picture" role="img" aria-label="Prepared paragraph"></div><pre id="source"></pre><p id="status" role="status"></p>
<script>
(()=>{'use strict';const ids=['sample','width','size','direction','alignment','mode'],picture=document.getElementById('picture'),source=document.getElementById('source'),status=document.getElementById('status'),fontSource=document.getElementById('font-source');let applied=null,busy=false,disposed=false,generation=0,recovery=false,refreshPending=false,terminal=false;
const integer=(v,a,b)=>Number.isInteger(v)&&v>=a&&v<=b,decode=value=>new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(atob(value),c=>c.charCodeAt(0)));
const controls=()=>{for(const n of document.querySelectorAll('.controls select,.controls button'))n.disabled=terminal||busy||recovery||disposed||!applied||applied.revision===4294967295; document.getElementById('refresh').disabled=terminal||disposed||refreshPending||applied?.delivery===4294967295; if(!busy&&!recovery&&!disposed&&applied){document.getElementById('narrower').disabled=applied.width===80;document.getElementById('wider').disabled=applied.width===640;}};
const command=(key,value)=>{if(disposed||busy||recovery||!applied||applied.revision===4294967295||!ids.includes(key)||!Number.isInteger(value)||value===applied[key])return false;const message={[key]:value,revision:applied.revision};busy=true;controls();try{if(window.ravetSend)window.ravetSend(message);else if(window.webkit?.messageHandlers?.ravet)window.webkit.messageHandlers.ravet.postMessage(message);else{busy=false;controls();return false;}}catch{busy=false;controls();return false;}return true;};
const reject=()=>{if(disposed)return;generation++;busy=false;recovery=true;refreshPending=false;status.textContent='The view could not be verified. The previous image is retained. Refresh the current view to continue.';controls();};
const refresh=()=>{if(disposed||terminal||refreshPending)return false;if(applied?.delivery===4294967295){status.textContent='The refresh counter is exhausted. Reopen this example to recover the view.';return false;}generation++;busy=false;recovery=true;refreshPending=true;status.textContent='Refreshing the current view; the previous image is retained.';controls();try{let accepted;if(window.ravetSend)accepted=window.ravetSend({refresh:1});else if(window.webkit?.messageHandlers?.ravet)window.webkit.messageHandlers.ravet.postMessage({refresh:1});else{reject();return false;}if(accepted===false){reject();return false;}}catch{reject();return false;}return true;};
document.getElementById('refresh').addEventListener('click',refresh);
for(const id of ids)document.getElementById(id).addEventListener('change',event=>command(id,Number(event.target.value)));
for(const [id,key,value]of[['narrower','width',m=>Math.max(80,m.width-80)],['wider','width',m=>Math.min(640,m.width+80)],['direction-toggle','direction',m=>1-m.direction],['next-sample','sample',m=>(m.sample+1)%8]])document.getElementById(id).addEventListener('click',()=>{if(applied)command(key,value(applied));});
const hash=bytes=>{let h=2166136261;for(const b of bytes)h=Math.imul(h^b,16777619)>>>0;return h;};
window.ravetUpdate=async m=>{if(disposed)return; if(!m||!integer(m.revision,0,4294967295)||!integer(m.delivery,0,4294967295)||typeof m.refreshExhausted!=='boolean'||(m.refreshExhausted&&m.delivery!==4294967295)){reject();return;}if(terminal||(m.refreshExhausted&&!refreshPending))return; if(applied&&(m.revision<applied.revision||m.delivery<applied.delivery||(m.revision===applied.revision&&(!refreshPending||m.delivery<=applied.delivery))))return; const epoch=++generation; if(!integer(m.sample,0,8)||!integer(m.width,80,640)||!integer(m.size,0,2)||!integer(m.direction,0,1)||!integer(m.alignment,0,2)||!integer(m.mode,0,1)||!integer(m.imageWidth,1,704)||!integer(m.imageHeight,1,384)||!integer(m.pixelHash,0,4294967295)||!integer(m.lineCount,1,256)||!integer(m.runCount,0,512)||!integer(m.missing,0,16384)||typeof m.payload!=='string'||m.payload.length>60000||typeof m.source!=='string'||m.source.length>5464||typeof m.fontSource!=='string'||m.fontSource.length>344||!['','InvalidInput','Capacity','Text','Raster','Image'].includes(m.diagnostic)||!Array.isArray(m.geometry)||m.geometry.length!==m.lineCount){reject();return;}
let text,font,bytes;try{text=decode(m.source);font=decode(m.fontSource);bytes=Uint8Array.from(atob(m.payload),c=>c.charCodeAt(0));if(m.mode===0){const xml=new DOMParser().parseFromString(decode(m.payload),'image/svg+xml');if(xml.querySelector('parsererror')||xml.documentElement.localName!=='svg'||xml.querySelector('script,image,foreignObject,use,text')||[...xml.querySelectorAll('*')].some(n=>[...n.attributes].some(a=>a.name.startsWith('on')||a.name.includes('href')))){reject();return;}}}catch{reject();return;}
let runs=0;for(const line of m.geometry){if(!integer(line.start,0,4096)||!integer(line.end,line.start,4096)||!integer(line.separatorEnd,line.end,4096)||!Number.isFinite(line.width)||line.width<0||!Number.isFinite(line.x)||line.x<0||!Number.isFinite(line.y)||line.y<0||typeof line.overflow!=='boolean'||!Array.isArray(line.runs)||line.runs.length>512){reject();return;}runs+=line.runs.length;for(const r of line.runs)if(!Array.isArray(r)||r.length!==5||!integer(r[0],0,2)||!integer(r[1],line.start,line.end)||!integer(r[2],r[1]+1,line.end)||!Number.isFinite(r[3])||r[3]<0||!integer(r[4],0,125)){reject();return;}}if(runs!==m.runCount){reject();return;}
const node=document.createElement('img');node.alt='';node.src=`data:image/${m.mode?'png':'svg+xml'};base64,${m.payload}`;try{await node.decode();}catch{if(epoch===generation)reject();return;}if(disposed||epoch!==generation)return;if(node.naturalWidth!==m.imageWidth||node.naturalHeight!==m.imageHeight){reject();return;}
let exact=true;if(m.mode){try{const c=document.createElement('canvas');c.width=m.imageWidth;c.height=m.imageHeight;const context=c.getContext('2d',{willReadFrequently:true});context.drawImage(node,0,0);exact=hash(context.getImageData(0,0,c.width,c.height).data)===m.pixelHash;}catch{reject();return;}if(!exact){reject();return;}}
if(m.refreshExhausted){busy=false;refreshPending=false;recovery=true;terminal=true;status.textContent='The refresh counter is exhausted. The previous verified image is retained. Reopen this example to continue.';controls();return;}
picture.replaceChildren(node);picture.setAttribute('aria-label',text||'Empty paragraph');source.textContent=text;const select=document.getElementById('width');for(const n of select.querySelectorAll('[data-measured]'))n.remove();if(![80,160,320,640].includes(m.width)){const n=document.createElement('option');n.value=String(m.width);n.textContent=`${m.width} (window)`;n.dataset.measured='true';select.append(n);}for(const id of ids)document.getElementById(id).value=String(m[id]);fontSource.textContent=font;status.textContent=m.diagnostic?'This paragraph could not fit the view; the previous image is retained.':`${m.lineCount} line${m.lineCount===1?'':'s'}, ${m.runCount} font runs${m.missing?`, ${m.missing} replacement glyphs`:''}.`;applied={...m,text,font,exact};busy=false;recovery=false;refreshPending=false;controls();};
window.ravetParagraphCommand=command;window.ravetParagraphRefresh=refresh;window.ravetParagraphReport=()=>applied?{revision:applied.revision,delivery:applied.delivery,sample:applied.sample,width:applied.width,size:applied.size,direction:applied.direction,alignment:applied.alignment,mode:applied.mode,payload:applied.payload,source:applied.source,geometry:applied.geometry,diagnostic:applied.diagnostic,pixelHash:applied.pixelHash,exact:applied.exact&&picture.firstElementChild?.src===`data:image/${applied.mode?'png':'svg+xml'};base64,${applied.payload}`&&source.textContent===applied.text&&ids.every(id=>document.getElementById(id).value===String(applied[id])),busy,recovery,refreshPending,terminal,status:status.textContent,viewport:[innerWidth,innerHeight],focus:document.activeElement?.id,documentFocus:document.hasFocus()}:null;
addEventListener('pagehide',()=>{disposed=true;generation++;busy=false;controls();},{once:true});controls();})();
</script></body></html>
