<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAVET SVG image import</title><style>body{font:16px system-ui;background:#eef2f6;color:#162436;margin:24px}label{display:inline-block;margin:10px 16px 10px 0}select{font:inherit}canvas{width:min(100%,640px);height:auto;image-rendering:auto;background:repeating-conic-gradient(#ddd 0 25%,white 0 50%) 50%/16px 16px;border:1px solid #678}:focus-visible{outline:3px solid #1474d8;outline-offset:3px}p{max-width:800px}section{margin-top:20px}</style><body><h1>Imported SVG image</h1><p>Rust imports the selected SVG into an owned image, then prepares straight sRGB bytes for this canvas. External resources and fonts are outside this image profile.</p><label for="source">Source <select id="source"><option value="scene">Gradient and clipped shapes</option><option value="logo">RAVET outlines</option><option value="integer">Integer rectangles</option></select></label><label for="fit">Fit <select id="fit"><option value="contain">Contain</option><option value="stretch">Stretch</option></select></label><label for="size">Pixel size <select id="size"><option value="128x64">128 × 64</option><option value="96x48">96 × 48</option><option value="160x48">160 × 48</option></select></label><section><canvas id="canvas" role="img" aria-label="Rust imported SVG pixels"></canvas></section><p id="status" role="status"></p><script>
(()=>{'use strict';let applied=null;const ids=['source','fit','size'],canvas=document.getElementById('canvas'),statusNode=document.getElementById('status');const send=msg=>{if(window.ravetSend)window.ravetSend(msg);else if(window.webkit?.messageHandlers?.ravet)window.webkit.messageHandlers.ravet.postMessage(msg);else statusNode.textContent='Native consumer transport unavailable.';};for(const id of ids)document.getElementById(id).addEventListener('change',event=>send({[id]:event.target.value}));
window.ravetUpdate=m=>{if(!m||!Number.isInteger(m.width)||!Number.isInteger(m.height)||!['scene','logo','integer'].includes(m.source)||!['contain','stretch'].includes(m.fit)||!['128x64','96x48','160x48'].includes(m.size)||m.size!==m.width+'x'+m.height||!Number.isInteger(m.revision)||m.revision<0||m.revision>4294967295||typeof m.straight!=='string'||m.straight.length>44000||!/^[A-Za-z0-9+/]*={0,2}$/.test(m.straight))return;let bytes;try{bytes=Uint8ClampedArray.from(atob(m.straight),c=>c.charCodeAt(0));}catch{return;}if(bytes.length!==m.width*m.height*4)return;canvas.width=m.width;canvas.height=m.height;canvas.getContext('2d').putImageData(new ImageData(bytes,m.width,m.height),0,0);for(const id of ids)document.getElementById(id).value=m[id];applied={...m,bytes};statusNode.textContent=`${m.source}, ${m.fit}, ${m.width} × ${m.height}; admitted revision ${m.revision}`;};
window.ravetSvgReport=()=>{if(!applied)return null;const actual=canvas.getContext('2d').getImageData(0,0,applied.width,applied.height).data;let maxPmaError=0;for(let i=0;i<actual.length;i+=4){maxPmaError=Math.max(maxPmaError,Math.abs(actual[i+3]-applied.bytes[i+3]));for(let c=0;c<3;c++)maxPmaError=Math.max(maxPmaError,Math.abs(Math.floor((actual[i+c]*actual[i+3]+127)/255)-Math.floor((applied.bytes[i+c]*applied.bytes[i+3]+127)/255)));}return {source:applied.source,fit:applied.fit,size:applied.size,revision:applied.revision,straight:applied.straight,maxPmaError,viewport:[innerWidth,innerHeight],focus:document.activeElement?.id};};
// Fixture-only independent SVG raster comparison; product pixels above come solely from Rust.
window.ravetSvgOracle=async source=>{if(!applied||typeof source!=='string'||source.length>8192)return {pass:false};const model=applied,url=URL.createObjectURL(new Blob([source],{type:'image/svg+xml'}));try{const im=new Image();im.src=url;await im.decode();const c=document.createElement('canvas');c.width=model.width;c.height=model.height;const ctx=c.getContext('2d'),sx=c.width/im.naturalWidth,sy=c.height/im.naturalHeight,s=Math.min(sx,sy);ctx.drawImage(im,model.fit==='contain'?(c.width-im.naturalWidth*s)/2:0,model.fit==='contain'?(c.height-im.naturalHeight*s)/2:0,model.fit==='contain'?im.naturalWidth*s:c.width,model.fit==='contain'?im.naturalHeight*s:c.height);const actual=ctx.getImageData(0,0,c.width,c.height).data,reference=model.bytes;let sum=0,max=0,large=0,inkA=0,inkB=0;const boxA=[c.width,c.height,-1,-1],boxB=[c.width,c.height,-1,-1];for(let i=0;i<actual.length;i+=4){let biggest=0;for(let j=0;j<4;j++){const a=j===3?actual[i+j]:Math.floor((actual[i+j]*actual[i+3]+127)/255),b=j===3?reference[i+j]:Math.floor((reference[i+j]*reference[i+3]+127)/255),d=Math.abs(a-b);sum+=d;max=Math.max(max,d);biggest=Math.max(biggest,d);}if(biggest>32)large++;const x=i/4%c.width,y=Math.floor(i/4/c.width);for(const [bytes,box]of [[actual,boxA],[reference,boxB]])if(bytes[i+3]>8){box[0]=Math.min(box[0],x);box[1]=Math.min(box[1],y);box[2]=Math.max(box[2],x);box[3]=Math.max(box[3],y);}if(actual[i+3]>8)inkA++;if(reference[i+3]>8)inkB++;}const mean=sum/actual.length,largeFraction=large/(c.width*c.height),boxError=Math.max(...boxA.map((v,i)=>Math.abs(v-boxB[i]))),inkRatio=inkA/inkB,exact=model.source==='integer';return {source:model.source,fit:model.fit,size:model.size,mean,max,largeFraction,boxError,inkRatio,exact,pass:exact?max===0:mean<=3&&largeFraction<=.05&&boxError<=2&&inkRatio>=.95&&inkRatio<=1.05};}finally{URL.revokeObjectURL(url);}};
})();
</script></body></html>
