<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAVET local font fallback</title><style>body{font:16px system-ui;color:#203e60;background:#eef2f6;margin:24px}label{display:inline-block;margin:8px 18px 8px 0}select{font:inherit}#picture{background:white;border:1px solid #75889f;width:min(100%,640px);aspect-ratio:2;display:grid;place-items:center}#picture svg,#picture canvas{width:100%;height:auto}p{max-width:700px}:focus-visible{outline:3px solid #176cd2;outline-offset:3px}</style><body><h1>Local font fallback</h1><p>Choose a sample and font order to explore how complete characters move between local fonts. Compare vector and pixel rendering of the same selected glyphs.</p><label for="sample">Sample <select id="sample"><option value="latin">Latin and ligature</option><option value="marks">Accents and combining marks</option><option value="arabic">Arabic context</option><option value="arabicmarks">Arabic marks</option><option value="missing">Missing characters</option></select></label><label for="order">Font order <select id="order"><option value="explicit">Synthetic fonts first</option><option value="noto">Noto first</option></select></label><label for="size">Text size <select id="size"><option>14</option><option>20</option><option>28</option></select></label><label for="mode">Rendering <select id="mode"><option value="svg">Vector</option><option value="raster">Pixels</option></select></label><div id="picture" role="img" aria-label="Prepared local text"></div><p id="source"></p><p id="status" role="status"></p><script>
(()=>{'use strict';let applied=null;const ids=['sample','order','size','mode'],picture=document.getElementById('picture'),sourceNode=document.getElementById('source'),statusNode=document.getElementById('status');
const send=msg=>{if(window.ravetSend)window.ravetSend(msg);else if(window.webkit?.messageHandlers?.ravet)window.webkit.messageHandlers.ravet.postMessage(msg);};
for(const id of ids)document.getElementById(id).addEventListener('change',event=>send({[id]:event.target.value}));
window.ravetUpdate=m=>{if(!m||!['latin','marks','arabic','arabicmarks','missing'].includes(m.sample)||!['explicit','noto'].includes(m.order)||![14,20,28].includes(m.size)||!['svg','raster'].includes(m.mode)||!Number.isInteger(m.revision)||m.revision<0||m.revision>4294967295||(applied&&m.revision<applied.revision)||typeof m.payload!=='string'||m.payload.length>65000||typeof m.source!=='string'||m.source.length>128||!Number.isInteger(m.missing)||m.missing<0||!Number.isFinite(m.advance)||!Array.isArray(m.runs)||m.runs.length>256)return;
let source,bytes,node;try{source=new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(atob(m.source),c=>c.charCodeAt(0)));bytes=Uint8Array.from(atob(m.payload),c=>c.charCodeAt(0));if(m.mode==='raster'){if(bytes.length!==128*64*4)return;node=document.createElement('canvas');node.width=128;node.height=64;node.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(bytes),128,64),0,0);}else{const text=new TextDecoder('utf-8',{fatal:true}).decode(bytes),doc=new DOMParser().parseFromString(text,'image/svg+xml');if(doc.querySelector('parsererror')||doc.documentElement.localName!=='svg'||doc.querySelector('script,image,foreignObject,use,text')||[...doc.querySelectorAll('*')].some(n=>[...n.attributes].some(a=>a.name.startsWith('on')||a.name.includes('href'))))return;node=document.importNode(doc.documentElement,true);}}catch{return;}
picture.replaceChildren(node);picture.setAttribute('aria-label',source);sourceNode.textContent=source;for(const id of ids)document.getElementById(id).value=String(m[id]);statusNode.textContent=m.missing?`${m.missing} replacement glyphs; ${m.runs.length} font runs.`:`${m.runs.length} font runs; all sample characters covered.`;applied={...m,sourceText:source,bytes};};
window.ravetFontReport=()=>{if(!applied)return null;let exact=true,paths=0;if(applied.mode==='raster'){const pixels=picture.firstElementChild.getContext('2d').getImageData(0,0,128,64).data;exact=pixels.length===applied.bytes.length&&pixels.every((v,i)=>v===applied.bytes[i]);}else{const svg=picture.firstElementChild;exact=svg.localName==='svg'&&svg.getAttribute('aria-label')===applied.sourceText;paths=svg.querySelectorAll('path').length;}return {revision:applied.revision,sample:applied.sample,order:applied.order,size:applied.size,mode:applied.mode,payload:applied.payload,source:applied.source,sourceText:sourceNode.textContent,exact,paths,viewport:[innerWidth,innerHeight],focus:document.activeElement?.id};};
})();
</script></body></html>
