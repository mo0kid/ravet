<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAVET system font selection</title><style>body{font:16px system-ui;background:#eef2f6;color:#203e60;margin:24px}label{display:inline-block;margin:8px 16px 8px 0}select,button{font:inherit}#picture{background:white;border:1px solid #75889f;width:min(100%,640px);aspect-ratio:8/3;display:grid;place-items:center}#picture svg,#picture canvas{width:100%;height:auto}:focus-visible{outline:3px solid #176cd2;outline-offset:3px}p{max-width:700px}</style><body><h1>System font selection</h1><p>Browse installed families and choose an exact style. The preview uses the selected font’s vector outlines or pixels.</p><div><button id="familyPrevious">Previous families</button><button id="familyNext">Next families</button><span id="familyCount"></span></div><label for="family">Family <select id="family"></select></label><div><button id="stylePrevious">Previous styles</button><button id="styleNext">Next styles</button><span id="styleCount"></span></div><label for="font">Style <select id="font"></select></label><button id="previousFont">Previous shown style</button><button id="nextFont">Next shown style</button><label for="sample">Sample <select id="sample"><option value="0">Agam0</option><option value="1">A g m 0</option></select></label><label for="size">Text size <select id="size"><option value="0">14</option><option value="1">20</option><option value="2">28</option></select></label><label for="mode">Rendering <select id="mode"><option value="0">Vector</option><option value="1">Pixels</option></select></label><div id="picture" role="img" aria-label="Selected font preview"></div><p id="selected"></p><p id="status" role="status"></p><script>
(()=>{'use strict';let applied=null;const $=id=>document.getElementById(id),picture=$('picture');
const send=(key,value)=>{if(!applied)return;const msg={[key]:value,revision:applied.revision};if(window.ravetSend)window.ravetSend(msg);else window.webkit?.messageHandlers?.ravet?.postMessage(msg);};
for(const key of ['family','font','sample','size','mode'])$(key).addEventListener('change',e=>send(key,Number(e.target.value)));
for(const [id,key,delta]of [['familyPrevious','familyPage',-1],['familyNext','familyPage',1],['stylePrevious','stylePage',-1],['styleNext','stylePage',1]])$(id).addEventListener('click',()=>send(key,applied[key]+delta));
for(const[id,delta]of [['previousFont',-1],['nextFont',1]])$(id).addEventListener('click',()=>{if(!applied||!applied.styles.length)return;let i=applied.styles.findIndex(s=>s.id===applied.selected);if(i<0)i=delta>0?-1:applied.styles.length;const next=applied.styles[i+delta];if(next)send('font',next.id);});
const uint=n=>Number.isInteger(n)&&n>=0&&n<=4294967295;
const names=a=>Array.isArray(a)&&a.length<=4&&a.every(x=>x&&uint(x.id)&&typeof x.name==='string'&&new TextEncoder().encode(x.name).length<=1024);
window.ravetUpdate=m=>{if(!m||!uint(m.revision)||(applied&&m.revision<applied.revision)||!uint(m.selected)||typeof m.postscript!=='string'||new TextEncoder().encode(m.postscript).length>1024||!uint(m.familyCount)||m.familyCount>4096||!uint(m.styleCount)||m.styleCount>4096||!uint(m.familyPage)||m.familyPage>=Math.ceil(m.familyCount/4)||!uint(m.stylePage)||m.stylePage>=Math.ceil(m.styleCount/4)||!uint(m.browseFamily)||m.browseFamily>=m.familyCount||!names(m.families)||!names(m.styles)||![0,1].includes(m.sample)||![0,1,2].includes(m.size)||!['svg','raster'].includes(m.mode)||!Number.isFinite(m.advance)||typeof m.payload!=='string'||m.payload.length>65000||!(m.diagnostic===null||['InvalidInput','Capacity','ForeignSelection','WrongThread','Unavailable','UnsupportedFont','NativeFailure'].includes(m.diagnostic))||!Array.isArray(m.coordinates)||m.coordinates.length>32||!m.coordinates.every(c=>c&&typeof c.tag==='string'&&/^[\x20-\x7e]{4}$/.test(c.tag)&&Number.isFinite(c.user)&&Number.isFinite(c.normalized)&&Math.abs(c.normalized)<=1))return;
let bytes,node;try{bytes=Uint8Array.from(atob(m.payload),c=>c.charCodeAt(0));if(m.mode==='raster'){if(bytes.length!==128*48*4)return;node=document.createElement('canvas');node.width=128;node.height=48;node.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(bytes),128,48),0,0);}else{if(bytes.length>32768)return;const text=new TextDecoder('utf-8',{fatal:true}).decode(bytes),doc=new DOMParser().parseFromString(text,'image/svg+xml');if(doc.querySelector('parsererror')||doc.documentElement.localName!=='svg'||doc.querySelector('script,image,foreignObject,use,text')||[...doc.querySelectorAll('*')].some(n=>[...n.attributes].some(a=>a.name.startsWith('on')||a.name.includes('href'))))return;node=document.importNode(doc.documentElement,true);}}catch{return;}
// Fully validate/decode before publishing DOM state; labels always use textContent.
const options=a=>a.map(x=>{const o=document.createElement('option');o.value=String(x.id);o.textContent=x.name||'(unnamed style)';return o;});
const familyOptions=options(m.families),styleOptions=options(m.styles);picture.replaceChildren(node);$('family').replaceChildren(...familyOptions);$('font').replaceChildren(...styleOptions);$('family').value=String(m.browseFamily);$('font').value=String(m.selected);$('sample').value=String(m.sample);$('size').value=String(m.size);$('mode').value=m.mode==='raster'?'1':'0';
const styleIndex=m.styles.findIndex(s=>s.id===m.selected);$('previousFont').disabled=!m.styles.length||styleIndex===0;$('nextFont').disabled=!m.styles.length||styleIndex===m.styles.length-1;
$('familyPrevious').disabled=m.familyPage===0;$('familyNext').disabled=(m.familyPage+1)*4>=m.familyCount;$('stylePrevious').disabled=m.stylePage===0;$('styleNext').disabled=(m.stylePage+1)*4>=m.styleCount;$('familyCount').textContent=`${m.familyCount} families, page ${m.familyPage+1}`;$('styleCount').textContent=`${m.styleCount} styles, page ${m.stylePage+1}`;$('selected').textContent=`Selected: ${m.postscript}`+(m.coordinates.length?`; axes ${m.coordinates.map(c=>`${c.tag} ${c.user} (${c.normalized} normalized)`).join(', ')}`:'');$('status').textContent=m.diagnostic?`Requested style unavailable: ${m.diagnostic}. Previous font retained.`:`Advance ${m.advance.toFixed(2)}; ${m.coordinates.length} variation axes.`;applied={...m,bytes};};
window.ravetSystemFontReport=()=>{if(!applied)return null;let exact=true;if(applied.mode==='raster'){const b=picture.firstElementChild.getContext('2d').getImageData(0,0,128,48).data;exact=b.length===applied.bytes.length&&b.every((v,i)=>v===applied.bytes[i]);}else exact=picture.firstElementChild.localName==='svg';return {revision:applied.revision,selected:applied.selected,postscript:applied.postscript,mode:applied.mode,payload:applied.payload,diagnostic:applied.diagnostic,exact,focus:document.activeElement?.id,viewport:[innerWidth,innerHeight],familyPage:applied.familyPage,stylePage:applied.stylePage};};
})();
</script></body></html>
