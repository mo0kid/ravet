[package]
name = "ravet-examples"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Interactive subtractive synth, effect, MPE and MIDI 2.0 examples"

[features]
default = ["live-ui"]
live-ui = ["dep:ravet-webview", "dep:serde_json", "dep:ravet-device", "dep:ravet-midi-device", "dep:rtrb"]

[dependencies]
ravet-foundation.workspace = true
ravet-signal.workspace = true
ravet-surface.workspace = true
ravet-instrument = { path = "../../crates/ravet-instrument" }
ravet-audio-file = { path = "../../crates/ravet-audio-file" }

[target.'cfg(target_os = "macos")'.dependencies]
ravet-webview = { path = "../../crates/ravet-webview", optional = true }
ravet-device = { path = "../../crates/ravet-device", optional = true }
ravet-midi-device = { path = "../../crates/ravet-midi-device", optional = true }
serde_json = { version = "=1.0.151", optional = true }
rtrb = { version = "=0.4.0", optional = true }

[dev-dependencies]
allocation-counter = "=0.8.1"

[lints.rust]
unsafe_code = "deny"
