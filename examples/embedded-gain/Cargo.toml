[package]
name = "ravet-embedded-gain"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Allocation-free stereo gain reference for embedded Rust and C consumers"

[features]
default = ["std"]
std = ["ravet-foundation/std"]
firmware-panic = []

[dependencies]
ravet-foundation = { path = "../../crates/ravet-foundation", default-features = false }
ravet-embedded = { path = "../../crates/ravet-embedded" }

[dev-dependencies]
allocation-counter = "=0.8.1"

[lints.rust]
unsafe_code = "deny"
