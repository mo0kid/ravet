[package]
name = "ravet-vst3-reference-native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Portable keyed-sidechain and event-probe references behind the RAVET reference VST3 modules"

[lib]
crate-type = ["rlib", "staticlib"]

[features]
# Test-only: install a counting global allocator in the staticlib and export
# `ravet_vst3_reference_allocation_count` so module tests can measure Rust heap
# operations inside the loaded reference bundles. Not for production use.
allocation-probe = []

[dependencies]
ravet-foundation.workspace = true

[dev-dependencies]
allocation-counter = "=0.8.1"

[lints.rust]
unsafe_code = "deny"
