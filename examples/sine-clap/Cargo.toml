[package]
name = "ravet-sine-clap"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "CLAP MIDI instrument export of the portable sine synthesis reference"

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "validate-sine"
path = "examples/validate.rs"

[lints.rust]
unsafe_code = "deny"

[dependencies]
ravet-foundation.workspace = true
ravet-instrument = { path = "../../crates/ravet-instrument" }
ravet-clap = { path = "../../crates/ravet-clap" }
clack-plugin.workspace = true
clack-extensions = { workspace = true, features = ["clack-plugin", "audio-ports", "note-ports", "params", "state", "tail"] }

[dev-dependencies]
clack-host = { workspace = true, features = ["clack-plugin"] }
clack-extensions = { workspace = true, features = ["clack-host"] }
ravet-clap-smoke = { path = "../../tools/clap-smoke" }
allocation-counter = "=0.8.1"
