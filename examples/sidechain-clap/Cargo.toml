[package]
name = "ravet-sidechain-clap"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Native f32/f64 CLAP sidechain bus validation reference"

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "validate-sidechain"
path = "examples/validate.rs"

[lints.rust]
unsafe_code = "deny"

[dependencies]
ravet-foundation.workspace = true
ravet-clap = { path = "../../crates/ravet-clap" }
clack-plugin.workspace = true
clack-extensions = { workspace = true, features = ["clack-plugin", "audio-ports", "tail"] }

[dev-dependencies]
clack-host = { workspace = true, features = ["clack-plugin"] }
clack-extensions = { workspace = true, features = ["clack-host"] }
allocation-counter = "=0.8.1"
ravet-clap-smoke = { path = "../../tools/clap-smoke" }
