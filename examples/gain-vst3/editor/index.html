<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'"><title>RAVET Gain</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#171e24;color:#e9edf0}body{margin:0;padding:24px;box-sizing:border-box}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1{margin:0;font-size:28px}.brand{letter-spacing:.2em;color:#91a4af;font-size:12px}section{background:#222d36;border:1px solid #354650;border-radius:12px;padding:20px}.row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}label{font-weight:600}input[type=range]{width:100%;accent-color:#79d4bd}input[type=number]{width:90px;background:#171e24;color:inherit;border:1px solid #465b67;border-radius:8px;padding:8px;font:inherit;text-align:right}input[type=checkbox]{accent-color:#79d4bd;width:20px;height:20px;vertical-align:middle}input:focus-visible{outline:2px solid #79d4bd;outline-offset:3px}.bounds{display:flex;justify-content:space-between;color:#91a4af;font-size:13px;margin-top:12px}.meters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.meters[hidden]{display:none}.meters div{min-width:0}.meters meter{display:block;width:100%;height:12px}.meters small{font-size:10px;white-space:nowrap}.meters label{font-size:12px}#status{color:#91a4af;margin-top:24px;min-height:1.5em}#status.error{color:#ffb2a3}
</style></head><body><header><div><div class="brand">RAVET</div><h1>Gain</h1></div><label><input id="bypass" type="checkbox"> Bypass</label></header><section><div class="row"><label for="gain">Amplitude</label><label><input id="gain-number" type="number" aria-label="Amplitude multiplier"> ×</label></div><input id="gain" type="range" aria-label="Amplitude multiplier"><div class="bounds"><span>0 ×</span><span>Unity 1 ×</span><span>4 ×</span></div></section><div id="meters" class="meters" hidden><div><label>Input L</label><meter id="meter-0"></meter><small id="reading-0"></small></div><div><label>Input R</label><meter id="meter-1"></meter><small id="reading-1"></small></div><div><label>Output L</label><meter id="meter-2"></meter><small id="reading-2"></small></div><div><label>Output R</label><meter id="meter-3"></meter><small id="reading-3"></small></div></div><p id="status" role="status" aria-live="polite">Ready</p>
<!-- RAVET_CONTROLS -->
<script>
const post=message=>window.webkit.messageHandlers.ravet.postMessage(message);
const gain=new RavetControls.Slider(document.getElementById('gain'),document.getElementById('gain-number'),{id:1,minimum:0,maximum:4,step:0.001},post);
const bypass=new RavetControls.Toggle(document.getElementById('bypass'),2,post);
gain.update(1);bypass.update(false);
const meters=['Input L','Input R','Output L','Output R'].map((label,i)=>new RavetControls.AccessibleMeter(document.getElementById(`meter-${i}`),document.getElementById(`reading-${i}`),{label:label+' audio level',maximum:4}));
window.ravetUpdate=snapshot=>{if(Array.isArray(snapshot.meters)&&snapshot.meters.length===4){snapshot.meters.forEach((reading,i)=>meters[i].update(reading));document.getElementById('meters').hidden=false;}gain.update(snapshot.gain);bypass.update(snapshot.bypass);const status=document.getElementById('status');status.textContent=snapshot.status;status.classList.toggle('error',snapshot.status!=='Ready');};
</script></body></html>
