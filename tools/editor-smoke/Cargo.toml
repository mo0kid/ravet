[package]
name = "ravet-editor-smoke"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Native macOS main-loop host probe for the RAVET Gain CLAP editor"

[lints.rust]
unsafe_code = "deny"

[dependencies]
clack-host.workspace = true
clack-extensions = { workspace = true, features = ["clack-host", "gui", "params", "state"] }
ravet-clap-smoke = { path = "../clap-smoke" }
ravet-gain = { path = "../../examples/gain" }
ravet-host = { path = "../../crates/ravet-host" }
ravet-foundation.workspace = true
ravet-graph = { path = "../../crates/ravet-graph" }
allocation-counter = "=0.8.1"
