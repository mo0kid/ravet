[package]
name = "ravet-foundry"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "RAVET project creation, configuration and build application"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
ravet-surface.workspace = true
ravet-data = { path = "../../crates/ravet-data" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.6"

[target.'cfg(target_os = "macos")'.dependencies]
ravet-webview = { path = "../../crates/ravet-webview" }

[lints.rust]
unsafe_code = "deny"
