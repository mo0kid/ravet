<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'">
<title>RAVET Foundry</title>
<style>
*{box-sizing:border-box}body{margin:0;background:var(--ravet-background);color:var(--ravet-foreground);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--ravet-border);border-radius:7px;padding:9px 14px;background:var(--ravet-raised);color:var(--ravet-foreground)}button:hover{border-color:var(--ravet-accent)}button:disabled{opacity:.45;cursor:default}button.primary{background:var(--ravet-accent);border-color:var(--ravet-accent);color:var(--ravet-accent-text);font-weight:650}input,select{width:100%;padding:8px 12px;border:1px solid var(--ravet-border);border-radius:7px;background:var(--ravet-background);color:var(--ravet-foreground)}input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--ravet-accent)}:focus-visible{outline:2px solid var(--ravet-accent);outline-offset:3px}[hidden]{display:none!important}
.app{display:grid;grid-template-columns:215px 1fr;min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;align-self:start;background:var(--ravet-panel);border-right:1px solid var(--ravet-border);padding:28px 18px;display:flex;flex-direction:column;gap:25px}.brand{padding:0 10px}.brand svg{display:block;width:112px;height:auto;color:var(--ravet-accent);margin-bottom:10px}.brand strong{display:block;font-size:26px;font-weight:600;letter-spacing:-1px}.brand span{font-size:11px;color:var(--ravet-muted)}nav{display:grid;gap:7px}nav button{text-align:left;background:transparent;border-color:transparent;padding:11px 12px}nav button.active{background:var(--ravet-raised);border-color:var(--ravet-border);color:var(--ravet-accent)}.sidebar-note{margin-top:auto;padding:14px 10px;color:var(--ravet-muted);font-size:12px}.sidebar-note strong{display:block;color:var(--ravet-foreground);margin-bottom:7px}.main{min-width:0;padding:24px 38px 24px;max-width:1150px;width:100%;margin:0 auto}.eyebrow{font-size:10px;letter-spacing:1.7px;color:var(--ravet-accent);text-transform:uppercase;font-weight:700}h1{font-size:30px;line-height:1.2;letter-spacing:-.7px;margin:9px 0}h2{font-size:15px;margin:0 0 18px}p{color:var(--ravet-muted);margin:0 0 24px}.templates{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.template{padding:18px 15px;background:var(--ravet-panel);border:1px solid var(--ravet-border);border-radius:9px;cursor:pointer;position:relative}.template:has(input:checked){border-color:var(--ravet-accent);box-shadow:inset 0 0 0 1px var(--ravet-accent)}.template input{position:absolute;right:12px;top:14px}.template .icon{display:block;font:23px monospace;color:var(--ravet-accent);margin-bottom:10px}.template strong{display:block;font-size:14px;margin-bottom:7px}.template span.desc{display:block;color:var(--ravet-muted);font-size:11px;line-height:1.6}.tag{display:inline-block;font-size:10px;border-radius:4px;padding:2px 6px;background:var(--ravet-raised);color:var(--ravet-muted);margin-top:12px}.panel{padding:23px;background:var(--ravet-panel);border:1px solid var(--ravet-border);border-radius:9px;margin-bottom:16px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:12px;color:var(--ravet-foreground)}.field.full{grid-column:1/-1}.path-input{display:flex;gap:8px;align-items:center}.path-input input{flex:1;min-width:0}.browse{display:grid;place-items:center;flex:none;width:39px;height:39px;padding:8px}.browse svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.hint{font-size:11px;color:var(--ravet-muted)}.check{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ravet-muted)}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.actions .spacer{flex:1}.status{display:flex;align-items:flex-start;gap:9px;padding:15px 0 0;color:var(--ravet-muted);font-size:12px}.dot{flex:none;width:7px;height:7px;background:var(--ravet-accent);border-radius:50%;margin-top:5px}.status[data-error=true]{color:#ffb8a3}.status[data-error=true] .dot{background:#ffb8a3}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--ravet-background);border:1px solid var(--ravet-border);padding:16px;border-radius:7px;max-height:310px;overflow:auto;font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;margin-bottom:0}.path{overflow-wrap:anywhere;font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--ravet-accent)}.build-options{display:flex;gap:22px;margin:18px 0}.empty{padding:35px;color:var(--ravet-muted);border:1px dashed var(--ravet-border);border-radius:9px}.warning{color:var(--ravet-muted);font-size:11px;margin-top:16px}.connected{font-size:10px;color:var(--ravet-muted);padding-left:10px}@media(max-width:900px){.main{padding:25px}.app{grid-template-columns:180px 1fr}.templates{gap:8px}.template{padding:15px 10px}.fields{gap:14px}}@media(max-width:650px){.app{display:block}.sidebar{position:static;height:auto;padding:15px;gap:10px;border-right:0;border-bottom:1px solid var(--ravet-border)}.brand strong{font-size:22px}nav{display:flex}nav button{padding:6px 10px}.sidebar-note,.brand span,.connected{display:none}.main{padding:22px 16px}.fields{grid-template-columns:1fr}.template strong{font-size:12px}.template input{right:8px;top:10px}.template .icon{font-size:18px}.panel{padding:17px}h1{font-size:25px}}
</style></head><body>
<div class="app">
 <aside class="sidebar"><div class="brand"><!-- RAVET_LOGO --><strong>Foundry</strong></div>
 <nav aria-label="Foundry navigation"><button class="active" data-page="create">New project</button><button data-page="project">Project settings</button><button data-page="build">Build &amp; tools</button></nav>
</aside>
 <main class="main">
  <section id="page-create"><h1>New project</h1>
   <div class="templates" role="radiogroup" aria-label="Project template">
    <label class="template"><input type="radio" name="kind" value="offline" checked><span class="icon">&gt;_</span><strong>Offline</strong></label>
    <label class="template"><input type="radio" name="kind" value="standalone"><span class="icon">▤</span><strong>Application</strong></label>
    <label class="template"><input type="radio" name="kind" value="plugin"><span class="icon">◫</span><strong>Plugin</strong></label>
   </div>
  </section>
  <section id="page-project" hidden><h1>Project settings</h1><div class="panel"><div class="field"><label for="open-root">Project directory or ravet-project.toml</label><div class="path-input"><input id="open-root" placeholder="Absolute path to your project"><button type="button" class="browse" data-browse="open-root" aria-label="Choose project directory" title="Choose project directory"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5a1 1 0 0 1 1-1h5l2 3h9a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M3 9h18"/></svg></button></div></div><div class="actions" style="margin-top:14px"><button id="open">Open project</button><span id="current-root" class="path"></span></div></div></section>
  <div id="settings">
   <div class="panel"><div class="fields">
    <div class="field"><label for="name">Package name</label><input id="name" value="my-audio-project" maxlength="64" spellcheck="false" required pattern="[a-z][a-z0-9_\-]{0,63}"></div>
    <div class="field"><label for="display-name">Product name</label><input id="display-name" value="My Audio Project" maxlength="128" required></div>
    <div class="field full" id="destination-field"><label for="destination">New project directory</label><div class="path-input"><input id="destination" placeholder="Absolute path outside the RAVET checkout" required><button type="button" class="browse" data-browse="destination" aria-label="Choose parent directory" title="Choose parent directory"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5a1 1 0 0 1 1-1h5l2 3h9a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M3 9h18"/></svg></button></div></div>
    <div class="field full"><label for="framework">Framework checkout</label><div class="path-input"><input id="framework" placeholder="Absolute path to RAVET" required><button type="button" class="browse" data-browse="framework" aria-label="Choose framework checkout" title="Choose framework checkout"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5a1 1 0 0 1 1-1h5l2 3h9a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M3 9h18"/></svg></button></div></div>

   <div id="plugin-settings" class="field full" hidden><div class="fields">
    <div class="field"><label for="plugin-type">Plugin type</label><select id="plugin-type"><option value="effect">Effect</option><option value="instrument">Instrument</option></select></div>
    <label class="check" id="editor-field"><input type="checkbox" id="native-editor" checked>Custom editor</label>
    <div class="field full"><label>Formats</label><div class="actions" id="formats"><label class="check"><input type="checkbox" name="format" value="clap" checked>CLAP</label><label class="check"><input type="checkbox" name="format" value="vst3">VST3</label><label class="check"><input type="checkbox" name="format" value="au">AU</label><label class="check"><input type="checkbox" name="format" value="auv3">AUv3</label><label class="check"><input type="checkbox" name="format" value="aax">AAX</label><label class="check"><input type="checkbox" name="format" value="lv2">LV2</label></div></div>
    <details class="field full"><summary>SDKs</summary><div class="fields" style="margin-top:14px">
<div class="field full" data-sdk="vst3"><label for="sdk-vst3">VST3 SDK</label><div class="path-input"><input id="sdk-vst3" spellcheck="false"><button type="button" class="browse" data-browse="sdk-vst3" aria-label="Choose VST3 SDK" title="Choose VST3 SDK"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5a1 1 0 0 1 1-1h5l2 3h9a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M3 9h18"/></svg></button></div></div><div class="field full" data-sdk="audio_unit"><label for="sdk-audio_unit">AudioUnitSDK</label><div class="path-input"><input id="sdk-audio_unit" spellcheck="false"><button type="button" class="browse" data-browse="sdk-audio_unit" aria-label="Choose AudioUnitSDK" title="Choose AudioUnitSDK"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5a1 1 0 0 1 1-1h5l2 3h9a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M3 9h18"/></svg></button></div></div><div class="field full" data-sdk="aax"><label for="sdk-aax">AAX SDK</label><div class="path-input"><input id="sdk-aax" spellcheck="false"><button type="button" class="browse" data-browse="sdk-aax" aria-label="Choose AAX SDK" title="Choose AAX SDK"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5a1 1 0 0 1 1-1h5l2 3h9a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M3 9h18"/></svg></button></div></div><div class="field full" data-sdk="lv2"><label for="sdk-lv2">LV2 SDK</label><div class="path-input"><input id="sdk-lv2" spellcheck="false"><button type="button" class="browse" data-browse="sdk-lv2" aria-label="Choose LV2 SDK" title="Choose LV2 SDK"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5a1 1 0 0 1 1-1h5l2 3h9a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M3 9h18"/></svg></button></div></div>
    </div></details>
   </div></div>
    <details class="field full"><summary>Product settings</summary><div class="fields" style="margin-top:14px">
    <div class="field"><label for="company">Company</label><input id="company" value="Your company" maxlength="128" required></div>
    <div class="field"><label for="version">Version</label><input id="version" value="0.1.0" maxlength="64" spellcheck="false" required></div>
    <div class="field"><label for="license">Licence</label><input id="license" value="GPL-3.0-only" maxlength="256" required></div>
    <div class="field"><label for="plugin-id">Product identifier</label><input id="plugin-id" value="com.example.my-audio-project" maxlength="255" spellcheck="false" required></div>

    </div></details>
   </div></div>
   <div class="actions"><span class="spacer"></span><button id="create" class="primary">Create project →</button><button id="regenerate" class="primary" hidden>Save &amp; regenerate</button></div>
  </div>
  <section id="page-build" hidden><h1>Build &amp; tools</h1>
   <div class="panel"><h2>Current project</h2><div id="build-root" class="path">No project open.</div><div class="build-options"><label class="check"><input id="release" type="checkbox">Release</label><label class="check"><input id="offline" type="checkbox">Offline</label></div><div class="actions"><select id="build-format" aria-label="Build format" style="width:110px" hidden></select><button id="build" class="primary">Build</button><button id="reveal">Open folder</button><span class="spacer"></span><button id="doctor">Check toolchain</button></div><div id="artifact" class="path"></div></div>
   <div class="panel"><h2>External editor</h2><div class="actions"><input id="editor-executable" value="code" aria-label="Editor executable" placeholder="Executable name or absolute path" style="flex:1;width:auto"><button id="edit">Open in editor</button></div></div>
   <div class="panel"><h2>Build output</h2><pre id="log" aria-label="Build output" tabindex="0"></pre></div>
  </section>
  <div class="status" id="status-bar" role="status" aria-live="polite"><span class="dot"></span><span id="status">Ready</span></div>
 </main>
</div>
<!-- RAVET_CONTROLS -->
<script>
(()=>{'use strict';
 const get=id=>document.getElementById(id);let current=null,root=null,lastProject='',busy=false,page='create',lastDirectory=0;
 function localError(text){get('status').textContent=text;get('status-bar').dataset.error='true';}
 function post(request){try{window.webkit.messageHandlers.ravet.postMessage(request);return true;}catch{localError('The RAVET project engine is unavailable in this preview.');return false;}}
 function navigate(next){page=next;for(const name of ['create','project','build'])get('page-'+name).hidden=name!==next;get('settings').hidden=next==='build';get('destination-field').hidden=next!=='create';get('create').hidden=next!=='create';get('regenerate').hidden=next!=='project';get('name').disabled=busy||next==='project';pluginSettings();for(const button of document.querySelectorAll('nav button'))button.classList.toggle('active',button.dataset.page===next);}
 for(const button of document.querySelectorAll('nav button'))button.onclick=()=>navigate(button.dataset.page);
 function kind(){return page==='project'&&current?current.kind:document.querySelector('input[name=kind]:checked').value;}
 function pluginSettings(){const plugin=kind()==='plugin';get('plugin-settings').hidden=!plugin;get('plugin-type').disabled=busy||(page==='project'&&Boolean(current));const instrument=get('plugin-type').value==='instrument';get('editor-field').hidden=instrument;for(const field of document.querySelectorAll('input[name=format]')){const unavailable=instrument&&['auv3','aax'].includes(field.value);field.disabled=busy||unavailable;if(unavailable)field.checked=false;field.parentElement.hidden=unavailable;}}
 for(const field of document.querySelectorAll('input[name=kind]'))field.onchange=pluginSettings;get('plugin-type').onchange=pluginSettings;
 function project(){return {schema_version:1,name:get('name').value.trim(),display_name:get('display-name').value.trim(),company:get('company').value.trim(),version:get('version').value.trim(),license:get('license').value.trim(),plugin_id:get('plugin-id').value.trim(),framework_path:get('framework').value.trim(),native_editor:get('native-editor').checked,kind:kind(),plugin_type:get('plugin-type').value,formats:[...document.querySelectorAll('input[name=format]:checked')].map(e=>e.value),sdks:Object.fromEntries(['vst3','audio_unit','aax','lv2'].map(key=>[key,get('sdk-'+key).value.trim()||null]))};}
 function valid(){for(const input of get('settings').querySelectorAll('input[required]')){if(input.closest('[hidden]'))continue;if(!input.checkValidity()){const details=input.closest('details');if(details)details.open=true;input.reportValidity();return false;}}return true;}
 function dispatch(action){
  if(busy)return false;
  if(action==='create'){if(!valid())return false;return post({action,destination:get('destination').value.trim(),project:project()});}
  if(action==='regenerate'){if(!root){localError('Open a project first.');return false;}if(!valid())return false;return post({action,root,project:project()});}
  if(action==='open'){const path=get('open-root').value.trim();if(!path){localError('Enter a project path.');return false;}return post({action,root:path});}
  if(action==='doctor')return post({action});
  if(!root){localError('Create or open a project first.');return false;}
  if(action==='reveal')return post({action,root});
  if(action==='edit')return post({action,root,editor:get('editor-executable').value.trim()});
  return post({action:'build',root,release:get('release').checked,offline:get('offline').checked,bundle:current?.kind==='plugin',format:current?.kind==='plugin'?get('build-format').value:null});
 }
 for(const button of document.querySelectorAll('[data-browse]'))new RavetControls.ActionButton(button,button.dataset.browse,message=>!busy&&post({action:'browse',field:message.action,initial:get(message.action).value.trim()}));
 for(const action of ['create','open','regenerate','build','reveal','edit','doctor'])new RavetControls.ActionButton(get(action),action,message=>dispatch(message.action));
 window.ravetUpdate=state=>{
  window.foundryConnected=true;window.foundryState=state;busy=Boolean(state.busy);
  for(const button of document.querySelectorAll('main button'))button.disabled=busy;
  for(const input of get('settings').querySelectorAll('input,select'))input.disabled=busy;pluginSettings();
  get('name').disabled=busy||page==='project';
  get('status').textContent=state.error||state.status;get('status-bar').dataset.error=String(Boolean(state.error));
  if(!get('framework').value)get('framework').value=state.framework_path||'';
  if(state.project){const key=JSON.stringify([state.root,state.project]);if(key!==lastProject){lastProject=key;current=state.project;root=state.root;for(const [id,key] of [['name','name'],['display-name','display_name'],['company','company'],['version','version'],['license','license'],['plugin-id','plugin_id'],['framework','framework_path']])get(id).value=current[key];get('native-editor').checked=current.native_editor;get('plugin-type').value=current.plugin_type||'effect';for(const field of document.querySelectorAll('input[name=format]'))field.checked=(current.formats||['clap']).includes(field.value);for(const key of ['vst3','audio_unit','aax','lv2'])get('sdk-'+key).value=current.sdks?.[key]||'';pluginSettings();get('build-format').replaceChildren(...(current.formats||['clap']).map(value=>new Option(value.toUpperCase(),value)));get('build-format').hidden=current.kind!=='plugin';get('open-root').value=root;get('current-root').textContent=root;get('build-root').textContent=root;if(page==='create')navigate('project');}}
  const selection=state.directory_selection;
  if(selection&&selection.sequence!==lastDirectory){lastDirectory=selection.sequence;const input=get(selection.field);if(input){let path=selection.path;if(selection.field==='destination'){const separator=path.includes('\\')&&!path.includes('/')?'\\':'/';path=path.replace(/[\\/]+$/,'')+separator+get('name').value.trim();}input.value=path;input.dispatchEvent(new Event('input',{bubbles:true}));}}
  get('regenerate').disabled=busy||!root;get('build').disabled=busy||!root;get('reveal').disabled=busy||!root;get('edit').disabled=busy||!root;
  get('artifact').textContent=state.artifact?'Output: '+state.artifact:'';
  const text=state.log||'';if(get('log').textContent!==text){get('log').textContent=text;get('log').scrollTop=get('log').scrollHeight;}
 };
 window.foundryReady=true;
})();
</script></body></html>
