[package]
name = "ravet-device-probe"
default-run = "ravet-device-probe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Explicit standalone and offline audio device/graph validation for RAVET"

[features]
default = []
resampled-playback = ["ravet-device/resampled-playback", "ravet-audio-file/resampled-playback"]

[dependencies]
ravet-device = { path = "../../crates/ravet-device" }
ravet-foundation.workspace = true
ravet-signal.workspace = true
ravet-graph = { path = "../../crates/ravet-graph" }
ravet-host = { path = "../../crates/ravet-host" }
ravet-audio-file = { path = "../../crates/ravet-audio-file" }
clack-host.workspace = true
allocation-counter = "=0.8.1"

[lints.rust]
unsafe_code = "deny"
