[workspace]
members = [
    "crates/ravet",
    "crates/ravet-foundation",
    "crates/ravet-embedded",
    "examples/embedded-gain",
    "crates/ravet-native",
    "crates/ravet-signal",
    "crates/ravet-native-dsp",
    "crates/ravet-surface",
    "crates/ravet-data",
    "crates/ravet-state",
    "crates/ravet-audio-file",
    "crates/ravet-instrument",
    "crates/ravet-graph",
    "crates/ravet-osc",
    "crates/ravet-midi-device",
    "crates/ravet-media",
    "crates/ravet-metal",
    "crates/ravet-core-midi",
    "crates/ravet-preset",
    "crates/ravet-host",
    "crates/ravet-webview",
    "crates/ravet-plugin",
    "examples/gain",
    "examples/gain-native",
    "examples/bus-routing-native",
    "examples/performance-native",
    "crates/ravet-clap",
    "examples/gain-clap",
    "examples/gain-plugin",
    "examples/delay-plugin",
    "examples/synth-plugin",
    "examples/sine-clap",
    "examples/sidechain-clap",
    "examples/vst3-reference-native",
    "examples/tutorials",
    "tools/clap-smoke",
    "tools/editor-smoke",
    "crates/ravet-device",
    "crates/ravet-runtime",
    "crates/ravet-runtime-ffi",
    "tools/device-probe",
    "tools/foundry",
]
resolver = "3"

[workspace.package]
license = "GPL-3.0-only"
version = "0.0.1"
rust-version = "1.88"
edition = "2024"
publish = false
repository = "https://github.com/mo0kid/ravet"
homepage = "https://djwaudio.co/ravet/"
documentation = "https://djwaudio.co/ravet/docs/"
readme = "README.md"
keywords = ["audio", "dsp", "plugin", "ravet"]
categories = ["multimedia::audio"]

[workspace.dependencies]
ravet = { path = "crates/ravet", version = "0.0.1" }
ravet-audio-file = { path = "crates/ravet-audio-file", version = "0.0.1" }
ravet-clap = { path = "crates/ravet-clap", version = "0.0.1" }
ravet-core-midi = { path = "crates/ravet-core-midi", version = "0.0.1" }
ravet-data = { path = "crates/ravet-data", version = "0.0.1" }
ravet-device = { path = "crates/ravet-device", version = "0.0.1" }
ravet-embedded = { path = "crates/ravet-embedded", version = "0.0.1" }
ravet-foundation = { path = "crates/ravet-foundation", version = "0.0.1" }
ravet-graph = { path = "crates/ravet-graph", version = "0.0.1" }
ravet-host = { path = "crates/ravet-host", version = "0.0.1" }
ravet-instrument = { path = "crates/ravet-instrument", version = "0.0.1" }
ravet-media = { path = "crates/ravet-media", version = "0.0.1" }
ravet-metal = { path = "crates/ravet-metal", version = "0.0.1" }
ravet-midi-device = { path = "crates/ravet-midi-device", version = "0.0.1" }
ravet-native = { path = "crates/ravet-native", version = "0.0.1" }
ravet-native-dsp = { path = "crates/ravet-native-dsp", version = "0.0.1" }
ravet-osc = { path = "crates/ravet-osc", version = "0.0.1" }
ravet-plugin = { path = "crates/ravet-plugin", version = "0.0.1" }
ravet-preset = { path = "crates/ravet-preset", version = "0.0.1" }
ravet-runtime = { path = "crates/ravet-runtime", version = "0.0.1" }
ravet-runtime-ffi = { path = "crates/ravet-runtime-ffi", version = "0.0.1" }
ravet-signal = { path = "crates/ravet-signal", version = "0.0.1" }
ravet-state = { path = "crates/ravet-state", version = "0.0.1" }
ravet-surface = { path = "crates/ravet-surface", version = "0.0.1" }
ravet-webview = { path = "crates/ravet-webview", version = "0.0.1" }
clack-plugin = "=0.2.0"
clack-host = "=0.2.0"
clack-extensions = "=0.2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
