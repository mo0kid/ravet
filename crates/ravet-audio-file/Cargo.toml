[package]
name = "ravet-audio-file"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Bounded WAV/AIFF and optional compressed audio streams with prepared handoff"

[lints]
workspace = true

[features]
default = []
compressed = ["dep:symphonia"]
flac-encode = ["dep:flacenc"]

[dependencies]
flacenc = { version = "=0.5.1", optional = true, default-features = false }
symphonia = { version = "=0.5.5", optional = true, default-features = false, features = ["flac", "mp3", "ogg", "vorbis"] }

[[example]]
name = "decode"
required-features = ["compressed"]

[dev-dependencies]
allocation-counter = "=0.8.1"

[[example]]
name = "encode-flac"
required-features = ["flac-encode"]

[[example]]
name = "capture-flac"
required-features = ["flac-encode"]
