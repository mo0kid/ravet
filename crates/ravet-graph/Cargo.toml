[package]
name = "ravet-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Explicit prepared acyclic audio routing and processor scheduling"

[features]
default = []
# Live convolution transitions (worker-prepared engines, bounded audio handoff,
# explicit crossfade and control-thread disposal) over ravet-signal's engines.
convolution-transitions = ["dep:ravet-signal"]

[dependencies]
ravet-foundation.workspace = true
ravet-signal = { workspace = true, optional = true }
rtrb = "=0.4.0"

[dev-dependencies]
allocation-counter = "=0.8.1"
ravet-gain = { path = "../../examples/gain" }
ravet-signal.workspace = true

# All graph code denies unsafe except the audited private typed storage module.
[lints.rust]
unsafe_code = "deny"
