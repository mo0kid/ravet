[package]
license.workspace = true
name = "ravet-plugin"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Product descriptions, format identities and versioned state for RAVET plug-in exports"

# One reviewed unsafe call attaches the editor to the host's view; everything
# else is safe code.
[lints.rust]
unsafe_code = "deny"

[features]
default = []
# Generic CLAP export through `export_plugin!`.
clap = ["dep:ravet-clap", "dep:ravet-native-dsp", "dep:ravet-webview", "dep:clack-plugin", "dep:clack-extensions"]

[dependencies]
ravet-foundation.workspace = true
ravet-clap = { workspace = true, optional = true }
ravet-native-dsp = { workspace = true, optional = true, features = ["std", "processor"] }
clack-plugin = { workspace = true, optional = true }
clack-extensions = { workspace = true, optional = true, features = ["clack-plugin", "audio-ports", "note-ports", "params", "state", "tail", "latency", "gui"] }
ravet-webview = { workspace = true, optional = true }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
