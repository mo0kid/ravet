[package]
license.workspace = true
name = "ravet-plugin"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Product descriptions, format identities and versioned state for RAVET plug-in exports"

# One reviewed unsafe call attaches the editor to the host's view; everything
# else is safe code.
[lints.rust]
unsafe_code = "deny"

[features]
default = []
# Generic CLAP export through `export_plugin!`.
clap = ["dep:ravet-clap", "dep:ravet-native-dsp", "dep:clack-plugin", "dep:clack-extensions"]
# The generic C table (`include/RavetPlugin.h`, `ravet_plugin_v1`) used by the
# VST3, AUv2, AAX and LV2 adapters.
native = ["dep:ravet-native", "dep:ravet-native-dsp"]
# The product's web editor in the CLAP export and the native table: Cocoa
# views on macOS, HWNDs on Windows and X11 windows on Linux. Without it no
# editor is offered: the CLAP GUI extension is absent and the table reports a
# 0 x 0 editor. Adds ravet-webview (WebKit/Cocoa on macOS; WebView2, needing
# RAVET_WEBVIEW2_SDK, on Windows; GTK 3/WebKitGTK 4.1 on Linux).
editor = ["dep:ravet-webview"]

[dependencies]
ravet-foundation.workspace = true
ravet-clap = { workspace = true, optional = true }
ravet-native = { workspace = true, optional = true }
ravet-native-dsp = { workspace = true, optional = true, features = ["std", "processor"] }
clack-plugin = { workspace = true, optional = true }
clack-extensions = { workspace = true, optional = true, features = ["clack-plugin", "audio-ports", "note-ports", "params", "state", "tail", "latency", "gui", "timer"] }
ravet-webview = { workspace = true, optional = true }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[dev-dependencies]
allocation-counter = "=0.8.1"
clack-host = { workspace = true, features = ["clack-plugin"] }
clack-extensions = { workspace = true, features = ["clack-host", "audio-ports"] }
ravet-clap-smoke = { path = "../../tools/clap-smoke" }
