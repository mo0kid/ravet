[package]
name = "ravet-device"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Explicit standalone audio device adapter for RAVET"

[features]
default = []
resampled-playback = ["ravet-audio-file/resampled-playback"]
vorbis-recording = ["ravet-audio-file/vorbis-encode"]
mp3-recording = ["ravet-audio-file/mp3-encode"]

[dependencies]
ravet-foundation.workspace = true
ravet-signal.workspace = true
ravet-audio-file = { path = "../ravet-audio-file" }
ravet-graph = { path = "../ravet-graph" }
cpal = "=0.18.2"
rtrb = "=0.4.0"

[dev-dependencies]
allocation-counter = "=0.8.1"

[lints.rust]
unsafe_code = "deny"
