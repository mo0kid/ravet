[package]
license.workspace = true
name = "ravet-surface"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Editors, controls, and visualisation for RAVET"

[lints]
workspace = true

[features]
default = []
text = ["dep:harfrust", "dep:read-fonts", "dep:unicode-bidi"]

[dependencies]
ravet-foundation.workspace = true
harfrust = { version = "=0.14.0", optional = true }
read-fonts = { version = "=0.45.0", optional = true }
unicode-bidi = { version = "=0.3.18", optional = true }

[dev-dependencies]
allocation-counter = "=0.8.1"

[[example]]
name = "shape-text"
required-features = ["text"]

[[example]]
name = "font-outlines"
required-features = ["text"]

[[example]]
name = "bidi-outlines"
required-features = ["text"]
